<template x-if="showCodeModal && selectedProject">
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto" @click.self="closeCodeModal()">
        <div class="bg-white rounded-2xl p-6 w-full max-w-4xl mx-4 my-8 fade-in-up" @click.stop>
            <div class="flex items-start justify-between gap-4 mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900" x-text="selectedProject.name"></h2>
                    <p class="text-sm text-gray-500 mt-2" x-text="selectedProject.slug"></p>
                </div>
                <button @click="closeCodeModal()" class="rounded-lg border border-gray-200 bg-white p-2 text-gray-400 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="mb-6 rounded-2xl border p-5" :class="installation.status === 'installed' ? 'border-green-200 bg-green-50' : 'border-purple-200 bg-purple-50'">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="flex items-start gap-3">
                        <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-lg font-bold" :class="installation.status === 'installed' ? 'bg-green-500 text-white' : 'bg-purple-600 text-white'" x-text="installation.status === 'installed' ? '✓' : '1'"></span>
                        <div>
                            <h3 class="font-semibold" :class="installation.status === 'installed' ? 'text-green-900' : 'text-purple-900'" x-text="installation.status === 'installed' ? t('installationReady') : t('installationPending')"></h3>
                            <p class="text-sm mt-1" :class="installation.status === 'installed' ? 'text-green-700' : 'text-purple-700'" x-text="installation.status === 'installed' ? `${t('lastRequest')} ${formatDateTime(installation.lastSeenAt)}` : t('installationPendingHint')"></p>
                        </div>
                    </div>
                    <button @click="loadInstallation(selectedProject.id, true)" :disabled="loadingInstallation" class="rounded-lg border border-white/80 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:border-purple-300 disabled:opacity-50" x-text="loadingInstallation ? t('checking') : t('checkInstallation')"></button>
                </div>
            </div>

            <div x-show="onboardingMode" class="mb-6 grid md:grid-cols-3 gap-3 text-sm">
                <div class="rounded-xl border border-purple-200 bg-purple-50 p-4"><span class="font-bold text-purple-600">1.</span> <span x-text="t('onboardingStep1')"></span></div>
                <div class="rounded-xl border border-gray-200 bg-white p-4"><span class="font-bold text-purple-600">2.</span> <span x-text="t('onboardingStep2')"></span></div>
                <div class="rounded-xl border border-gray-200 bg-white p-4"><span class="font-bold text-purple-600">3.</span> <span x-text="t('onboardingStep3')"></span></div>
            </div>

            <div x-show="embedFormat !== 'website'" class="mb-6 rounded-xl border border-purple-100 bg-purple-50 p-4 grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('homepageUrl')"></label>
                    <input x-model="codeSettings.homepageUrl" type="text" class="w-full px-4 py-3 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white" :placeholder="t('homepageUrlPlaceholder')">
                    <p class="mt-2 text-xs text-gray-500" x-text="t('homepageUrlHint')"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('pageId')"></label>
                    <input x-model="codeSettings.pageId" type="text" class="w-full px-4 py-3 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white" :placeholder="t('pageIdPlaceholder')">
                    <p class="mt-2 text-xs text-gray-500" x-text="t('pageIdHint')"></p>
                </div>
            </div>

            <div class="mb-6 rounded-xl border border-gray-200 bg-gray-50 p-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                    <div>
                        <h3 class="font-semibold text-gray-900" x-text="t('recommendedEmbed')"></h3>
                        <p class="text-xs text-gray-500 mt-1" x-text="t('recommendedEmbedHint')"></p>
                    </div>
                    <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1">
						<button @click="embedFormat = 'website'" class="rounded-md px-3 py-1.5 text-sm font-medium" :class="embedFormat === 'website' ? 'bg-purple-600 text-white' : 'text-gray-600'" x-text="lang === 'zh' ? '网站 JS 探针 SDK' : 'Website JS SDK'"></button>
                        <button @click="embedFormat = 'github'" class="rounded-md px-3 py-1.5 text-sm" :class="embedFormat === 'github' ? 'bg-purple-600 text-white' : 'text-gray-600'">GitHub / Markdown</button>
                        <button @click="embedFormat = 'html'" class="rounded-md px-3 py-1.5 text-sm" :class="embedFormat === 'html' ? 'bg-purple-600 text-white' : 'text-gray-600'">HTML</button>
                    </div>
                </div>
                <p x-show="embedFormat === 'website'" class="text-xs text-purple-700 bg-purple-50 border border-purple-200 rounded-lg p-2.5 mb-3" x-text="lang === 'zh' ? '将以下代码粘贴到你的网站或博客 HTML 的 <head> 或 <body> 标签中，即可开启实时访客统计、PV/UV、会话流向与转化分析：' : 'Paste the code below into your website HTML <head> or <body> to start real-time analytics:'"></p>
                <div class="flex flex-col sm:flex-row items-stretch gap-3">
                    <code class="flex-1 rounded-lg border border-gray-200 bg-white p-3 text-sm text-gray-700 break-all" x-text="getRecommendedEmbed()"></code>
                    <button @click="copyText(getRecommendedEmbed())" class="rounded-lg bg-purple-600 px-5 py-2 text-sm font-medium text-white hover:bg-purple-700" x-text="t('copy')"></button>
                </div>
				<div x-show="embedFormat === 'website'" class="mt-5 border-t border-gray-200 pt-5">
					<div class="flex items-center justify-between gap-4 mb-3">
						<div>
							<div class="font-medium text-gray-900" x-text="t('websiteTracking')"></div>
							<p class="text-xs text-gray-500 mt-1" x-text="t('websiteTrackingHint')"></p>
						</div>
						<label class="inline-flex items-center gap-2 text-sm text-gray-700">
							<input type="checkbox" x-model="websiteTrackingEnabled" class="rounded border-gray-300 text-purple-600 focus:ring-purple-500">
							<span x-text="t('enabled')"></span>
						</label>
					</div>
					<label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('allowedDomains')"></label>
					<textarea x-model="websiteDomainsInput" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white" :placeholder="t('allowedDomainsPlaceholder')"></textarea>
					<p class="mt-2 text-xs text-gray-500" x-text="t('allowedDomainsHint')"></p>
					<button @click="saveWebsiteTracking()" :disabled="savingWebsiteTracking" class="mt-3 rounded-lg border border-purple-200 bg-white px-4 py-2 text-sm font-medium text-purple-700 hover:bg-purple-50 disabled:opacity-50" x-text="savingWebsiteTracking ? t('saving') : t('saveSettings')"></button>
				</div>
            </div>

            <div x-show="embedFormat !== 'website'" class="grid lg:grid-cols-2 gap-6">
                <div class="bg-gray-50 rounded-xl p-5 space-y-4">
                    <h3 class="text-lg font-semibold text-gray-900" x-text="t('counterSvg')"></h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('metricName')"></label>
                        <input x-model="codeSettings.counterName" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('metricNamePlaceholder')">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('displayLabel')"></label>
                        <input x-model="codeSettings.counterLabel" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('displayLabelPlaceholder')">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('colorOptional')"></label>
                        <input x-model="codeSettings.counterColor" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('colorPlaceholder')">
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('preview')"></div>
                        <div class="bg-white border rounded-lg p-4 min-h-16 flex items-center">
                            <a :href="getHomepageLink() || getAbsoluteUrl(getCounterSvgPath(selectedProject, true))" target="_blank" rel="noopener noreferrer" class="inline-flex">
                                <img :src="getCounterSvgPath(selectedProject, true)" class="h-8" alt="Counter preview">
                            </a>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('svgLink')"></div>
                        <div class="bg-white border rounded-lg p-3 flex items-center justify-between gap-4">
                            <code class="text-sm text-gray-600 break-all" x-text="getCounterSvgUrl()"></code>
                            <button @click="copyText(getCounterSvgUrl())" class="px-3 py-1 rounded-lg border border-purple-200 bg-purple-50 text-purple-600 hover:bg-purple-100 hover:border-purple-300 hover:text-purple-800 shrink-0 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-colors" x-text="t('copy')"></button>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('markdownCode')"></div>
                        <div class="bg-white border rounded-lg p-3 flex items-center justify-between gap-4">
                            <code class="text-sm text-gray-600 break-all" x-text="getCounterMarkdown()"></code>
                            <button @click="copyText(getCounterMarkdown())" class="px-3 py-1 rounded-lg border border-purple-200 bg-purple-50 text-purple-600 hover:bg-purple-100 hover:border-purple-300 hover:text-purple-800 shrink-0 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-colors" x-text="t('copy')"></button>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-5 space-y-4">
                    <h3 class="text-lg font-semibold text-gray-900" x-text="t('badgeSvg')"></h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('metricName')"></label>
                        <input x-model="codeSettings.badgeName" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('metricNamePlaceholder')">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('displayLabel')"></label>
                        <input x-model="codeSettings.badgeLabel" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('displayLabelPlaceholder')">
                    </div>
                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('colorOptional')"></label>
                            <input x-model="codeSettings.badgeColor" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" :placeholder="t('colorPlaceholder')">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2" x-text="t('badgeStyle')"></label>
                            <select x-model="codeSettings.badgeStyle" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                                <option value="" x-text="t('badgeStyleDefault')"></option>
                                <option value="flat" x-text="t('badgeStyleFlat')"></option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('preview')"></div>
                        <div class="bg-white border rounded-lg p-4 min-h-16 flex items-center">
                            <a :href="getHomepageLink() || getAbsoluteUrl(getBadgeSvgPath(selectedProject, true))" target="_blank" rel="noopener noreferrer" class="inline-flex">
                                <img :src="getBadgeSvgPath(selectedProject, true)" class="h-5" alt="Badge preview">
                            </a>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('svgLink')"></div>
                        <div class="bg-white border rounded-lg p-3 flex items-center justify-between gap-4">
                            <code class="text-sm text-gray-600 break-all" x-text="getBadgeSvgUrl()"></code>
                            <button @click="copyText(getBadgeSvgUrl())" class="px-3 py-1 rounded-lg border border-purple-200 bg-purple-50 text-purple-600 hover:bg-purple-100 hover:border-purple-300 hover:text-purple-800 shrink-0 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-colors" x-text="t('copy')"></button>
                        </div>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-gray-700 mb-2" x-text="t('markdownCode')"></div>
                        <div class="bg-white border rounded-lg p-3 flex items-center justify-between gap-4">
                            <code class="text-sm text-gray-600 break-all" x-text="getBadgeMarkdown()"></code>
                            <button @click="copyText(getBadgeMarkdown())" class="px-3 py-1 rounded-lg border border-purple-200 bg-purple-50 text-purple-600 hover:bg-purple-100 hover:border-purple-300 hover:text-purple-800 shrink-0 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-colors" x-text="t('copy')"></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6">
                <button @click="closeCodeModal()" class="px-6 py-2 rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors" x-text="t('close')"></button>
            </div>
        </div>
    </div>
</template>
