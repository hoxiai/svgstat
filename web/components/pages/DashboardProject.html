<template x-if="currentPage === 'project-detail'">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in-up">
        <div x-show="!selectedProject" class="text-center py-12">
            <div class="animate-spin w-12 h-12 border-4 border-purple-200 border-purple-600 rounded-full mx-auto mb-4"></div>
            <p class="text-gray-600" x-text="t('loading')"></p>
        </div>

        <div x-show="selectedProject" class="space-y-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <button @click="navigate('/dashboard')" class="inline-flex items-center rounded-lg border border-purple-200 bg-white px-4 py-2 text-purple-600 hover:bg-purple-50 hover:border-purple-300 hover:text-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-colors">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span x-text="t('backToProjects')"></span>
                </button>
                <div class="flex items-center gap-3">
                    <button @click="openCodeModal(selectedProject)" class="inline-flex items-center gap-2 rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white hover:bg-purple-700 shadow-sm transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                        </svg>
                        <span x-text="lang === 'zh' ? '获取 SDK / 嵌入代码' : 'Get SDK / Embed Code'"></span>
                    </button>
                </div>
            </div>

            <div class="rounded-xl border p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3" :class="installation.status === 'installed' ? 'border-green-200 bg-green-50' : 'border-amber-200 bg-amber-50'">
                <div>
                    <div class="font-semibold" :class="installation.status === 'installed' ? 'text-green-900' : 'text-amber-900'" x-text="installation.status === 'installed' ? t('installationReady') : t('installationPending')"></div>
                    <div class="text-sm mt-1" :class="installation.status === 'installed' ? 'text-green-700' : 'text-amber-700'" x-text="installation.status === 'installed' ? `${t('lastRequest')} ${formatDateTime(installation.lastSeenAt)}` : t('installationPendingHint')"></div>
                </div>
                <button x-show="installation.status !== 'installed'" @click="openCodeModal(selectedProject, true)" class="rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white hover:bg-purple-700" x-text="t('getCode')"></button>
            </div>

			<div class="bg-white rounded-xl shadow-sm p-6 stat-card">
				<div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><h3 class="font-semibold text-gray-900" x-text="t('issueCenterTitle')"></h3><p class="text-sm text-gray-500 mt-1" x-text="t('issueCenterHint')"></p></div><div class="flex items-center gap-3"><span class="rounded-full border px-3 py-1 text-xs font-medium" :class="getIssueStatusClass(issueReport.status)" x-text="t(`issueStatus_${issueReport.status}`)"></span><div x-show="loadingIssues" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div></div></div>
				<div x-show="issueReport.issues.length" class="mt-5 space-y-3"><template x-for="issue in issueReport.issues" :key="`${issue.code}-${issue.subject}`"><div class="rounded-xl border p-4" :class="getIssueClass(issue.severity)"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><span class="rounded-full px-2 py-0.5 text-xs font-semibold uppercase" :class="issue.severity === 'critical' ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'" x-text="t(`issueSeverity_${issue.severity}`)"></span><h4 class="font-semibold text-gray-900" x-text="getIssueTitle(issue)"></h4></div><p class="mt-2 text-sm text-gray-700" x-text="getIssueAdvice(issue)"></p></div><div class="shrink-0 rounded-lg bg-white/70 px-3 py-2 text-right text-xs text-gray-500"><div><span x-text="t('issueCurrent')"></span>: <strong class="text-gray-900" x-text="formatIssueValue(issue, 'current')"></strong></div><div><span x-text="t('issuePrevious')"></span>: <span x-text="formatIssueValue(issue, 'previous')"></span></div><div x-show="issue.changePercent != null" class="mt-1 font-medium" :class="issue.changePercent < 0 ? 'text-red-600' : 'text-amber-600'" x-text="formatChange(issue.changePercent)"></div></div></div></div></template></div>
				<div x-show="!loadingIssues &amp;&amp; issueReport.status === 'healthy'" class="mt-5 rounded-xl border border-green-100 bg-green-50 px-4 py-4 text-sm text-green-700" x-text="t('issueHealthyHint')"></div>
				<div x-show="!loadingIssues &amp;&amp; issueReport.status === 'insufficient_data'" class="mt-5 rounded-xl border border-blue-100 bg-blue-50 px-4 py-4 text-sm text-blue-700" x-text="t('issueInsufficientHint')"></div>
			</div>

			<div class="bg-white rounded-xl shadow-sm p-6 stat-card">
				<div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-5">
					<div><h3 class="font-semibold text-gray-900" x-text="t('sessionQualityTitle')"></h3><p class="text-sm text-gray-500 mt-1" x-text="t('sessionQualityHint')"></p></div>
					<div class="flex items-center gap-3"><span class="text-xs text-gray-400" x-text="`${trendDays}${t('daysShort')}`"></span><div x-show="loadingSessionQuality" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div></div>
				</div>
				<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
					<div class="rounded-lg bg-violet-50 p-4"><div class="text-2xl font-bold text-violet-600" x-text="sessionQuality.totals.sessions"></div><div class="text-xs text-gray-500" x-text="t('sessions')"></div></div>
					<div class="rounded-lg bg-amber-50 p-4"><div class="text-2xl font-bold text-amber-600" x-text="formatPercent(sessionQuality.totals.bounceRate)"></div><div class="text-xs text-gray-500" x-text="t('bounceRate')"></div></div>
					<div class="rounded-lg bg-sky-50 p-4"><div class="text-2xl font-bold text-sky-600" x-text="formatDecimal(sessionQuality.totals.averagePages)"></div><div class="text-xs text-gray-500" x-text="t('pagesPerSession')"></div></div>
					<div class="rounded-lg bg-emerald-50 p-4"><div class="text-2xl font-bold text-emerald-600" x-text="formatDurationSeconds(sessionQuality.totals.averageDurationSeconds)"></div><div class="text-xs text-gray-500" x-text="t('averageEngagement')"></div></div>
				</div>
				<p class="text-xs text-gray-400 mb-5" x-text="t('sessionQualityDefinition')"></p>
				<div x-show="sessionQuality.totals.sessions" class="grid lg:grid-cols-2 gap-6">
					<div class="grid sm:grid-cols-2 gap-5">
						<div><h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('entryPages')"></h4><div class="space-y-2"><template x-for="entry in sessionQuality.entrances" :key="entry.path"><div class="flex justify-between gap-3 text-sm"><span class="truncate font-mono text-gray-600" :title="entry.path" x-text="entry.path"></span><span class="font-medium text-gray-900" x-text="entry.count"></span></div></template><p x-show="!sessionQuality.entrances.length" class="text-sm text-gray-400" x-text="t('noData')"></p></div></div>
						<div><h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('exitPages')"></h4><div class="space-y-2"><template x-for="entry in sessionQuality.exits" :key="entry.path"><div class="flex justify-between gap-3 text-sm"><span class="truncate font-mono text-gray-600" :title="entry.path" x-text="entry.path"></span><span class="font-medium text-gray-900" x-text="entry.count"></span></div></template><p x-show="!sessionQuality.exits.length" class="text-sm text-gray-400" x-text="t('noData')"></p></div></div>
						<div class="sm:col-span-2 border-t border-gray-100 pt-4"><h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('pageFlows')"></h4><div class="space-y-2"><template x-for="flow in sessionQuality.flows" :key="`${flow.from}-${flow.to}`"><div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)_auto] items-center gap-2 text-sm"><span class="truncate font-mono text-gray-600" :title="flow.from" x-text="flow.from"></span><span class="text-gray-300">→</span><span class="truncate font-mono text-gray-600" :title="flow.to" x-text="flow.to"></span><span class="font-medium text-gray-900" x-text="flow.count"></span></div></template><p x-show="!sessionQuality.flows.length" class="text-sm text-gray-400" x-text="t('noPageFlows')"></p></div></div>
					</div>
					<div><div class="flex items-center justify-between gap-3 mb-3"><h4 class="text-sm font-medium text-gray-800" x-text="t('channelQuality')"></h4><select x-model="sessionQualityDimension" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm"><template x-for="dimension in ['source','medium','campaign','device','country']" :key="dimension"><option :value="dimension" x-text="t(`dimension_${dimension}`)"></option></template></select></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs text-gray-400 border-b"><tr><th class="text-left py-2" x-text="t('segment')"></th><th class="text-right" x-text="t('sessions')"></th><th class="text-right" x-text="t('bounceRate')"></th><th class="text-right" x-text="t('pagesPerSession')"></th><th class="text-right" x-text="t('averageEngagement')"></th></tr></thead><tbody><template x-for="segment in getSessionQualitySegments()" :key="segment.value"><tr class="border-b border-gray-50"><td class="py-2 max-w-32 truncate" :title="segment.value" x-text="segment.value"></td><td class="text-right" x-text="segment.sessions"></td><td class="text-right" x-text="formatPercent(segment.bounceRate)"></td><td class="text-right" x-text="formatDecimal(segment.averagePages)"></td><td class="text-right" x-text="formatDurationSeconds(segment.averageDurationSeconds)"></td></tr></template></tbody></table><p x-show="!getSessionQualitySegments().length" class="text-center text-sm text-gray-400 py-5" x-text="t('noSessionSegments')"></p></div></div>
				</div>
				<p x-show="!sessionQuality.totals.sessions &amp;&amp; !loadingSessionQuality" class="text-center text-gray-500 py-6" x-text="t('noSessionQuality')"></p>
			</div>

			<div class="bg-white rounded-xl shadow-sm p-6 stat-card">
				<div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-5"><div><h3 class="font-semibold text-gray-900" x-text="t('webQualityTitle')"></h3><p class="text-sm text-gray-500 mt-1" x-text="t('webQualityHint')"></p></div><span class="rounded-full border px-3 py-1 text-xs font-medium" :class="getQualityStatusClass(eventReport.quality.status)" x-text="t(`quality_${eventReport.quality.status}`)"></span></div>
				<div class="grid sm:grid-cols-3 gap-3 mb-5"><template x-for="name in ['lcp','inp','cls']" :key="name"><div class="rounded-xl border p-4" :class="getQualityStatusClass(getWebVital(name).rating)"><div class="flex items-center justify-between gap-2"><span class="font-semibold uppercase" x-text="name"></span><span class="text-xs" x-text="t(`quality_${getWebVital(name).rating}`)"></span></div><div class="text-2xl font-bold mt-2" x-text="formatVital(getWebVital(name))"></div><div class="text-xs opacity-75 mt-1" x-text="getWebVital(name).samples ? `${getWebVital(name).samples} ${t('samples')} · ${getWebVital(name).visitors} ${t('anonymousVisitors')}` : t('noQualityData')"></div><p class="text-xs opacity-80 mt-3" x-text="t(`vital_${name}_hint`)"></p></div></template></div>
				<div class="grid md:grid-cols-2 gap-3"><div class="rounded-xl border border-gray-100 bg-gray-50 p-4"><div class="font-medium text-gray-900" x-text="t('javascriptErrors')"></div><div class="mt-2"><span class="text-2xl font-bold text-red-600" x-text="eventReport.quality.javascript.count"></span><span class="ml-2 text-sm text-gray-500" x-text="`${eventReport.quality.javascript.visitors} ${t('affectedVisitors')}`"></span></div><p class="text-xs text-gray-500 mt-2" x-text="t('javascriptErrorsHint')"></p><p x-show="getQualityDetails('js_error_type').length" class="mt-3 break-words font-mono text-xs text-gray-600" x-text="formatQualityDetails('js_error_type')"></p></div><div class="rounded-xl border border-gray-100 bg-gray-50 p-4"><div class="font-medium text-gray-900" x-text="t('resourceErrors')"></div><div class="mt-2"><span class="text-2xl font-bold text-red-600" x-text="eventReport.quality.resources.count"></span><span class="ml-2 text-sm text-gray-500" x-text="`${eventReport.quality.resources.visitors} ${t('affectedVisitors')}`"></span></div><p class="text-xs text-gray-500 mt-2" x-text="t('resourceErrorsHint')"></p><p x-show="getQualityDetails('resource_target_path').length" class="mt-3 break-words font-mono text-xs text-gray-600" x-text="formatQualityDetails('resource_target_path')"></p></div></div>
				<div x-show="eventReport.quality.status === 'no_data'" class="mt-4 rounded-lg bg-blue-50 px-4 py-3 text-sm text-blue-700" x-text="t('webQualityWaiting')"></div>
			</div>

			<div class="bg-white rounded-xl shadow-sm p-6 stat-card">
				<div class="flex items-center justify-between gap-4 mb-4">
					<div>
						<h3 class="font-semibold text-gray-900" x-text="t('realtimeOverview')"></h3>
						<p class="text-sm text-gray-500 mt-1" x-text="projectRealtime.lastSeenAt ? `${t('lastRequest')} ${formatDateTime(projectRealtime.lastSeenAt)}` : t('realtimeWaiting')"></p>
					</div>
					<span class="inline-flex items-center gap-2 text-sm text-green-700"><span class="h-2.5 w-2.5 rounded-full bg-green-500 animate-pulse"></span><span x-text="t('live')"></span></span>
				</div>
				<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
					<div class="rounded-lg bg-purple-50 p-4"><div class="text-3xl font-bold text-purple-600" x-text="projectRealtime.pv5 || 0"></div><div class="text-sm text-gray-600" x-text="t('pageviews5m')"></div></div>
					<div class="rounded-lg bg-blue-50 p-4"><div class="text-3xl font-bold text-blue-600" x-text="projectRealtime.visitors5 || 0"></div><div class="text-sm text-gray-600" x-text="t('visitors5m')"></div></div>
					<div class="rounded-lg bg-purple-50 p-4"><div class="text-3xl font-bold text-purple-600" x-text="projectRealtime.pv30 || 0"></div><div class="text-sm text-gray-600" x-text="t('pageviews30m')"></div></div>
					<div class="rounded-lg bg-blue-50 p-4"><div class="text-3xl font-bold text-blue-600" x-text="projectRealtime.visitors30 || 0"></div><div class="text-sm text-gray-600" x-text="t('visitors30m')"></div></div>
				</div>
			</div>

            <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
                <div class="flex items-center justify-between gap-4 mb-4">
                    <h3 class="font-semibold text-gray-900" x-text="t('todayOverview')"></h3>
                    <div x-show="loadingStats" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-lg p-4">
                        <div class="text-3xl font-bold text-purple-600" x-text="projectStats.pv || 0"></div>
                        <div class="text-sm text-gray-600" x-text="t('pv')"></div>
                    </div>
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-4">
                        <div class="text-3xl font-bold text-blue-600" x-text="projectStats.uv || 0"></div>
                        <div class="text-sm text-gray-600" x-text="t('uv')"></div>
                    </div>
                    <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-4">
                        <div class="text-3xl font-bold text-green-600" x-text="projectStats.requests || 0"></div>
                        <div class="text-sm text-gray-600" x-text="t('totalRequests')"></div>
                    </div>
                    <div class="bg-gradient-to-br from-orange-50 to-orange-100 rounded-lg p-4">
                        <div class="text-3xl font-bold text-orange-600" x-text="projectStats.bots || 0"></div>
                        <div class="text-sm text-gray-600" x-text="t('bots')"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h3 class="font-semibold text-gray-900" x-text="t('trafficTrend')"></h3>
						<p class="text-sm text-gray-500 mt-1" x-text="projectTrend.startDate &amp;&amp; projectTrend.endDate ? `${formatTrendDate(projectTrend.startDate)} – ${formatTrendDate(projectTrend.endDate)}` : t('trendLoading')"></p>
                    </div>
                    <div class="flex items-center gap-2">
                        <template x-for="days in [7, 30, 90]" :key="days">
                            <button
                                @click="setTrendDays(days)"
                                class="rounded-lg border px-3 py-1.5 text-sm transition-colors"
                                :class="trendDays === days ? 'border-purple-600 bg-purple-600 text-white' : 'border-gray-200 bg-white text-gray-600 hover:border-purple-300 hover:text-purple-600'"
                                x-text="`${days}${t('daysShort')}`">
                            </button>
                        </template>
                        <div x-show="loadingTrend" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full ml-2"></div>
                    </div>
                </div>

				<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div class="rounded-lg bg-purple-50 p-3">
						<div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-purple-600" x-text="projectAnalysis.current.pv || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.pv == null ? 'text-gray-400' : (projectAnalysis.changes.pv >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.pv)"></span></div>
                        <div class="text-xs text-gray-500" x-text="t('trendPV')"></div>
                    </div>
                    <div class="rounded-lg bg-blue-50 p-3">
						<div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-blue-600" x-text="projectAnalysis.current.uv || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.uv == null ? 'text-gray-400' : (projectAnalysis.changes.uv >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.uv)"></span></div>
                        <div class="text-xs text-gray-500" x-text="t('trendUV')"></div>
                    </div>
                    <div class="rounded-lg bg-green-50 p-3">
						<div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-green-600" x-text="projectAnalysis.current.requests || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.requests == null ? 'text-gray-400' : (projectAnalysis.changes.requests >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.requests)"></span></div>
                        <div class="text-xs text-gray-500" x-text="t('trendRequests')"></div>
                    </div>
					<div class="rounded-lg bg-orange-50 p-3">
						<div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-orange-600" x-text="projectAnalysis.current.bots || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.bots == null ? 'text-gray-400' : (projectAnalysis.changes.bots >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.bots)"></span></div>
						<div class="text-xs text-gray-500" x-text="t('bots')"></div>
					</div>
                </div>
				<p class="text-xs text-gray-400 mb-4" x-text="t('comparisonHint')"></p>

                <div class="rounded-xl border border-gray-100 bg-gray-50 p-4 overflow-hidden">
                    <svg viewBox="0 0 1000 240" class="w-full h-60" preserveAspectRatio="none" role="img" :aria-label="t('trafficTrend')">
                        <line x1="0" y1="220" x2="1000" y2="220" stroke="#e5e7eb" stroke-width="2"></line>
                        <line x1="0" y1="110" x2="1000" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="8 8"></line>
                        <polyline :points="getTrendPoints('requests')" fill="none" stroke="#22c55e" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                        <polyline :points="getTrendPoints('pv')" fill="none" stroke="#9333ea" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                        <polyline :points="getTrendPoints('uv')" fill="none" stroke="#2563eb" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                    </svg>
                    <div class="flex items-center justify-between text-xs text-gray-400 mt-2">
                        <span x-text="formatTrendDate(projectTrend.startDate)"></span>
                        <div class="flex flex-wrap justify-center gap-4 text-gray-600">
                            <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span><span x-text="t('trendPV')"></span></span>
                            <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span><span x-text="t('trendUV')"></span></span>
                            <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span><span x-text="t('trendRequests')"></span></span>
                        </div>
                        <span x-text="formatTrendDate(projectTrend.endDate)"></span>
                    </div>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
                    <h3 class="font-semibold text-gray-900 mb-4" x-text="t('topReferrers')"></h3>
					<div class="space-y-3" x-show="getSortedEntries(projectAnalysis.breakdowns.referrers, 8).length > 0">
						<template x-for="entry in getSortedEntries(projectAnalysis.breakdowns.referrers, 8)" :key="entry[0]">
                            <div class="flex items-center justify-between gap-4">
                                <span class="text-gray-700 truncate flex-1" x-text="entry[0]"></span>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <div class="w-32 bg-gray-200 rounded-full h-2">
										<div class="bg-pink-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.referrers)"></div>
                                    </div>
                                    <span class="text-sm text-gray-500 min-w-8 text-right" x-text="entry[1]"></span>
                                </div>
                            </div>
                        </template>
                    </div>
					<p x-show="getSortedEntries(projectAnalysis.breakdowns.referrers, 8).length === 0" class="text-gray-500 text-center py-4" x-text="t('referrerHint')"></p>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
                    <h3 class="font-semibold text-gray-900 mb-4" x-text="t('topCountries')"></h3>

                <div class="flex items-center justify-between gap-4 mb-4">
                    <h3 class="font-semibold text-gray-900" x-text="t('visitorDetails')"></h3>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-500" x-text="`${t('recentVisitors')} / ${visitorsPage.total || 0} UV`"></span>
                        <span class="text-sm text-gray-400" x-show="visitorsPage.totalPages > 0" x-text="getVisitorPaginationText()"></span>
                    </div>
                </div>

                <div class="grid md:grid-cols-5 gap-3 mb-5">
                    <select x-model="visitorFilters.device" @change="applyVisitorFilters()" class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-200">
                        <option value="" x-text="t('allDevices')"></option>
                        <option value="desktop">desktop</option>
                        <option value="mobile">mobile</option>
                        <option value="tablet">tablet</option>
                    </select>

                    <select x-model="visitorFilters.browser" @change="applyVisitorFilters()" class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-200">
                        <option value="" x-text="t('allBrowsers')"></option>
                        <option value="chrome">chrome</option>
                        <option value="safari">safari</option>
                        <option value="firefox">firefox</option>
                        <option value="edge">edge</option>
                    </select>

                    <input
                        x-model="visitorFilters.path"
                        @keydown.enter.prevent="applyVisitorFilters()"
                        class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-200"
                        :placeholder="t('pathPlaceholder')">

                    <select x-model="visitorFilters.sort" @change="applyVisitorFilters()" class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-200">
                        <option value="last_seen_desc" x-text="t('sortRecent')"></option>
                        <option value="requests_desc" x-text="t('sortRequestsDesc')"></option>
                        <option value="requests_asc" x-text="t('sortRequestsAsc')"></option>
                    </select>

                    <div class="flex items-center gap-2">
                        <select x-model.number="visitorFilters.pageSize" @change="applyVisitorFilters()" class="flex-1 rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-200">
                            <option :value="10">10</option>
                            <option :value="20">20</option>
                            <option :value="50">50</option>
                        </select>
                        <button @click="applyVisitorFilters()" class="inline-flex items-center rounded-lg border border-purple-200 bg-purple-50 px-3 py-2 text-sm text-purple-600 hover:border-purple-300 hover:bg-purple-100 transition-colors" x-text="t('applyFilters')"></button>
                        <button @click="resetVisitorFilters()" class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-600 hover:border-purple-200 hover:text-purple-600 transition-colors" x-text="t('resetFilters')"></button>
                    </div>
                </div>

                <template x-if="loadingVisitors">
                    <div class="text-center py-6">
                        <div class="animate-spin w-6 h-6 border-2 border-purple-200 border-purple-600 rounded-full mx-auto mb-3"></div>
                        <p class="text-sm text-gray-500" x-text="t('visitorLoading')"></p>
                    </div>
                </template>

                <div x-show="!loadingVisitors && visitorsPage.items && visitorsPage.items.length > 0" class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead>
                            <tr class="text-left text-xs uppercase tracking-wide text-gray-400">
                                <th class="py-3 pr-4 font-medium" x-text="t('visitorId')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('recentIp')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('visitorPage')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('deviceBrowser')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('location')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('requestsCount')"></th>
                                <th class="py-3 pr-4 font-medium" x-text="t('firstSeen')"></th>
                                <th class="py-3 font-medium" x-text="t('lastSeen')"></th>
                            </tr>
                        </thead>
                        <template x-for="visitor in visitorsPage.items" :key="visitor.visitorId">
                            <tbody class="divide-y divide-gray-100">
                                    <tr class="align-top cursor-pointer hover:bg-gray-50 transition-colors" @click="toggleVisitorDetail(visitor.visitorId)">
                                        <td class="py-4 pr-4">
                                            <div class="flex items-center gap-2">
                                                <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-purple-50 text-purple-600 text-xs font-semibold" x-text="expandedVisitorId === visitor.visitorId ? '-' : '+'"></span>
                                                <div class="font-mono text-sm text-gray-800" x-text="shortVisitorId(visitor.visitorId)"></div>
                                            </div>
                                        </td>
                                        <td class="py-4 pr-4">
                                            <div class="font-mono text-sm text-gray-700" x-text="visitor.ip || '-'"></div>
                                        </td>
                                        <td class="py-4 pr-4 max-w-xs">
                                            <div class="text-sm text-gray-700 break-all" x-text="visitor.referrer || '-'"></div>
                                        </td>
                                        <td class="py-4 pr-4">
                                            <div class="text-sm text-gray-700" x-text="`${visitor.deviceType || '-'} / ${visitor.browser || '-'}`"></div>
                                        </td>
                                        <td class="py-4 pr-4">
                                            <div class="text-sm text-gray-700" x-text="formatVisitorLocation(visitor)"></div>
                                        </td>
                                        <td class="py-4 pr-4">
                                            <div class="text-sm font-medium text-gray-800" x-text="visitor.requests || 0"></div>
                                        </td>
                                        <td class="py-4 pr-4">
                                            <div class="text-sm text-gray-600" x-text="formatDateTime(visitor.firstSeenAt)"></div>
                                        </td>
                                        <td class="py-4">
                                            <div class="text-sm text-gray-600" x-text="formatDateTime(visitor.lastSeenAt)"></div>
                                        </td>
                                    </tr>
                                    <tr x-show="expandedVisitorId === visitor.visitorId" class="bg-gray-50">
                                        <td colspan="8" class="px-4 py-4">
                                            <div class="grid md:grid-cols-3 gap-4">
                                                <div class="bg-white rounded-lg border border-gray-100 p-4">
                                                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-2" x-text="t('fullVisitorId')"></div>
                                                    <div class="font-mono text-sm text-gray-700 break-all" x-text="visitor.visitorId || '-'"></div>
                                                </div>
                                                <div class="bg-white rounded-lg border border-gray-100 p-4">
                                                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-2" x-text="t('lastPath')"></div>
                                                    <div class="text-sm text-gray-700 break-all" x-text="visitor.path || '-'"></div>
                                                </div>
                                                <div class="bg-white rounded-lg border border-gray-100 p-4">
                                                    <div class="text-xs uppercase tracking-wide text-gray-400 mb-2" x-text="t('location')"></div>
                                                    <div class="text-sm text-gray-700 break-all" x-text="formatVisitorLocation(visitor)"></div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                            </tbody>
                        </template>
                    </table>
                </div>

                <div x-show="!loadingVisitors && visitorsPage.items && visitorsPage.items.length > 0" class="mt-5 flex items-center justify-between gap-4">
                    <button
                        @click="changeVisitorPage(visitorsPage.page - 1)"
                        :disabled="visitorsPage.page <= 1"
                        class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm text-gray-600 hover:border-purple-200 hover:text-purple-600 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        x-text="t('previousPage')">
                    </button>
                    <span class="text-sm text-gray-500" x-show="visitorsPage.totalPages > 0" x-text="getVisitorPaginationText()"></span>
                    <button
                        @click="changeVisitorPage(visitorsPage.page + 1)"
                        :disabled="visitorsPage.totalPages === 0 || visitorsPage.page >= visitorsPage.totalPages"
                        class="inline-flex items-center rounded-lg border border-purple-200 bg-purple-50 px-4 py-2 text-sm text-purple-600 hover:border-purple-300 hover:bg-purple-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        x-text="t('nextPage')">
                    </button>
                </div>

                <p x-show="!loadingVisitors && (!visitorsPage.items || visitorsPage.items.length === 0)" class="text-gray-500 text-center py-6" x-text="t('noData')"></p>
            </div>
        </div>
    </div>
</template>
