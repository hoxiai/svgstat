<!-- ======================================================== -->
<!-- TAB 3: 体验与质量 (QUALITY) -->
<!-- ======================================================== -->
<div x-show="projectTab === 'quality'" class="space-y-6">
    <!-- Web Quality (Web Vitals + 客户端报错) -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-5">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('webQualityTitle')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="t('webQualityHint')"></p>
            </div>
            <span class="rounded-full border px-3 py-1 text-xs font-medium" :class="getQualityStatusClass(eventReport.quality.status)" x-text="t(`quality_${eventReport.quality.status}`)"></span>
        </div>
        <div class="grid sm:grid-cols-3 gap-3 mb-5">
            <template x-for="name in ['lcp','inp','cls']" :key="name">
                <div class="rounded-xl border p-4" :class="getQualityStatusClass(getWebVital(name).rating)">
                    <div class="flex items-center justify-between gap-2">
                        <span class="font-semibold uppercase" x-text="name"></span>
                        <span class="text-xs" x-text="t(`quality_${getWebVital(name).rating}`)"></span>
                    </div>
                    <div class="text-2xl font-bold mt-2" x-text="formatVital(getWebVital(name))"></div>
                    <div class="text-xs opacity-75 mt-1" x-text="getWebVital(name).samples ? `${getWebVital(name).samples} ${t('samples')} · ${getWebVital(name).visitors} ${t('anonymousVisitors')}` : t('noQualityData')"></div>
                    <p class="text-xs opacity-80 mt-3" x-text="t(`vital_${name}_hint`)"></p>
                </div>
            </template>
        </div>
        <div class="grid md:grid-cols-2 gap-3">
            <div class="rounded-xl border border-gray-100 bg-gray-50 p-4">
                <div class="font-medium text-gray-900" x-text="t('javascriptErrors')"></div>
                <div class="mt-2">
                    <span class="text-2xl font-bold text-red-600" x-text="eventReport.quality.javascript.count"></span>
                    <span class="ml-2 text-sm text-gray-500" x-text="`${eventReport.quality.javascript.visitors} ${t('affectedVisitors')}`"></span>
                </div>
                <p class="text-xs text-gray-500 mt-2" x-text="t('javascriptErrorsHint')"></p>
                <p x-show="getQualityDetails('js_error_type').length" class="mt-3 break-words font-mono text-xs text-gray-600" x-text="formatQualityDetails('js_error_type')"></p>
            </div>
            <div class="rounded-xl border border-gray-100 bg-gray-50 p-4">
                <div class="font-medium text-gray-900" x-text="t('resourceErrors')"></div>
                <div class="mt-2">
                    <span class="text-2xl font-bold text-red-600" x-text="eventReport.quality.resources.count"></span>
                    <span class="ml-2 text-sm text-gray-500" x-text="`${eventReport.quality.resources.visitors} ${t('affectedVisitors')}`"></span>
                </div>
                <p class="text-xs text-gray-500 mt-2" x-text="t('resourceErrorsHint')"></p>
                <p x-show="getQualityDetails('resource_target_path').length" class="mt-3 break-words font-mono text-xs text-gray-600" x-text="formatQualityDetails('resource_target_path')"></p>
            </div>
        </div>
        <div x-show="eventReport.quality.status === 'no_data'" class="mt-4 rounded-lg bg-blue-50 px-4 py-3 text-sm text-blue-700" x-text="t('webQualityWaiting')"></div>
    </div>

    <!-- Session Quality (会话时长、跳出率、页面流转) -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 mb-5">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('sessionQualityTitle')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="t('sessionQualityHint')"></p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-gray-400" x-text="`${trendDays}${t('daysShort')}`"></span>
                <div x-show="loadingSessionQuality" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div>
            </div>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <div class="rounded-lg bg-violet-50 p-4"><div class="text-2xl font-bold text-violet-600" x-text="sessionQuality.totals.sessions"></div><div class="text-xs text-gray-500" x-text="t('sessions')"></div></div>
            <div class="rounded-lg bg-amber-50 p-4"><div class="text-2xl font-bold text-amber-600" x-text="formatPercent(sessionQuality.totals.bounceRate)"></div><div class="text-xs text-gray-500" x-text="t('bounceRate')"></div></div>
            <div class="rounded-lg bg-sky-50 p-4"><div class="text-2xl font-bold text-sky-600" x-text="formatDecimal(sessionQuality.totals.averagePages)"></div><div class="text-xs text-gray-500" x-text="t('pagesPerSession')"></div></div>
            <div class="rounded-lg bg-emerald-50 p-4"><div class="text-2xl font-bold text-emerald-600" x-text="formatDurationSeconds(sessionQuality.totals.averageDurationSeconds)"></div><div class="text-xs text-gray-500" x-text="t('averageEngagement')"></div></div>
        </div>
        <p class="text-xs text-gray-400 mb-5" x-text="t('sessionQualityDefinition')"></p>
        <div x-show="sessionQuality.totals.sessions" class="grid lg:grid-cols-2 gap-6">
            <div class="grid sm:grid-cols-2 gap-5">
                <div>
                    <h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('entryPages')"></h4>
                    <div class="space-y-2">
                        <template x-for="entry in sessionQuality.entrances" :key="entry.path">
                            <div class="flex justify-between gap-3 text-sm"><span class="truncate font-mono text-gray-600" :title="entry.path" x-text="entry.path"></span><span class="font-medium text-gray-900" x-text="entry.count"></span></div>
                        </template>
                        <p x-show="!sessionQuality.entrances.length" class="text-sm text-gray-400" x-text="t('noData')"></p>
                    </div>
                </div>
                <div>
                    <h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('exitPages')"></h4>
                    <div class="space-y-2">
                        <template x-for="entry in sessionQuality.exits" :key="entry.path">
                            <div class="flex justify-between gap-3 text-sm"><span class="truncate font-mono text-gray-600" :title="entry.path" x-text="entry.path"></span><span class="font-medium text-gray-900" x-text="entry.count"></span></div>
                        </template>
                        <p x-show="!sessionQuality.exits.length" class="text-sm text-gray-400" x-text="t('noData')"></p>
                    </div>
                </div>
                <div class="sm:col-span-2 border-t border-gray-100 pt-4">
                    <h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('pageFlows')"></h4>
                    <div class="space-y-2">
                        <template x-for="flow in sessionQuality.flows" :key="`${flow.from}-${flow.to}`">
                            <div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)_auto] items-center gap-2 text-sm">
                                <span class="truncate font-mono text-gray-600" :title="flow.from" x-text="flow.from"></span>
                                <span class="text-gray-300">→</span>
                                <span class="truncate font-mono text-gray-600" :title="flow.to" x-text="flow.to"></span>
                                <span class="font-medium text-gray-900" x-text="flow.count"></span>
                            </div>
                        </template>
                        <p x-show="!sessionQuality.flows.length" class="text-sm text-gray-400" x-text="t('noPageFlows')"></p>
                    </div>
                </div>
            </div>
            <div>
                <div class="flex items-center justify-between gap-3 mb-3">
                    <h4 class="text-sm font-medium text-gray-800" x-text="t('channelQuality')"></h4>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-1 text-xs text-gray-500" x-show="getTotalCount(getSessionQualitySegments()) > sessionSegmentsPageSize">
                            <button @click="changeListPage('sessionSegmentsPage', -1, getSessionQualitySegments(), sessionSegmentsPageSize)" :disabled="sessionSegmentsPage <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                            </button>
                            <span x-text="`${sessionSegmentsPage} / ${getTotalPages(getSessionQualitySegments(), sessionSegmentsPageSize)}`"></span>
                            <button @click="changeListPage('sessionSegmentsPage', 1, getSessionQualitySegments(), sessionSegmentsPageSize)" :disabled="sessionSegmentsPage >= getTotalPages(getSessionQualitySegments(), sessionSegmentsPageSize)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                        <select x-model="sessionQualityDimension" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm">
                            <template x-for="dimension in ['source','medium','campaign','device','country']" :key="dimension">
                                <option :value="dimension" x-text="t(`dimension_${dimension}`)"></option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-xs text-gray-400 border-b">
                            <tr>
                                <th class="text-left py-2" x-text="t('segment')"></th>
                                <th class="text-right" x-text="t('sessions')"></th>
                                <th class="text-right" x-text="t('bounceRate')"></th>
                                <th class="text-right" x-text="t('pagesPerSession')"></th>
                                <th class="text-right" x-text="t('averageEngagement')"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="segment in getPaginatedList(getSessionQualitySegments(), sessionSegmentsPage, sessionSegmentsPageSize)" :key="segment.value">
                                <tr class="border-b border-gray-50">
                                    <td class="py-2 max-w-32 truncate font-medium" :title="segment.value" x-text="segment.value"></td>
                                    <td class="text-right" x-text="segment.sessions"></td>
                                    <td class="text-right" x-text="formatPercent(segment.bounceRate)"></td>
                                    <td class="text-right" x-text="formatDecimal(segment.averagePages)"></td>
                                    <td class="text-right font-mono text-xs" x-text="formatDurationSeconds(segment.averageDurationSeconds)"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <p x-show="!getSessionQualitySegments().length" class="text-center text-sm text-gray-400 py-5" x-text="t('noSessionSegments')"></p>
                </div>
            </div>
        </div>
        <p x-show="!sessionQuality.totals.sessions && !loadingSessionQuality" class="text-center text-gray-500 py-6 text-sm" x-text="t('noSessionQuality')"></p>
    </div>
</div>
