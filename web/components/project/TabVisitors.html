<!-- ======================================================== -->
<!-- TAB 4: 实时访问明细与 IP 列表 (REALTIME ACCESS STREAM & IP VISITORS) -->
<!-- ======================================================== -->
<div x-show="projectTab === 'visitors'" class="space-y-6">
    <!-- 主卡片 -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <!-- Top Bar: Segmented Switcher, Auto-refresh toggle, and Refresh button -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-100">
            <div>
                <div class="flex flex-wrap items-center gap-3">
                    <h3 class="font-semibold text-gray-900 text-base" x-text="visitorViewMode === 'stream' ? t('realtimeStream') : t('viewIPVisitors')"></h3>
                    
                    <!-- Segmented Switcher between [ ⚡ 实时访问流水 ] and [ 👥 今日 IP 列表 ] -->
                    <div class="inline-flex items-center gap-1 bg-gray-100/90 p-1 rounded-lg border border-gray-200/60 shadow-xs">
                        <button
                            @click="switchVisitorViewMode('stream')"
                            type="button"
                            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5"
                            :class="visitorViewMode === 'stream' ? 'bg-purple-600 text-white shadow-xs' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'">
                            <span x-text="t('viewRealtimeStream')"></span>
                        </button>
                        <button
                            @click="switchVisitorViewMode('ip')"
                            type="button"
                            class="px-3 py-1.5 text-xs font-semibold rounded-md transition-all flex items-center gap-1.5"
                            :class="visitorViewMode === 'ip' ? 'bg-purple-600 text-white shadow-xs' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'">
                            <span x-text="t('viewIPVisitors')"></span>
                        </button>
                    </div>

                    <!-- Auto-refresh status badge (only in stream view) -->
                    <span x-show="visitorViewMode === 'stream'" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium"
                          :class="autoRefreshStream ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-gray-100 text-gray-600'">
                        <span class="h-2 w-2 rounded-full" :class="autoRefreshStream ? 'bg-green-500 animate-pulse' : 'bg-gray-400'"></span>
                        <span x-text="autoRefreshStream ? t('autoRefreshOn') : t('autoRefreshOff')"></span>
                    </span>
                </div>
                <p class="text-xs text-gray-500 mt-1.5" x-text="visitorViewMode === 'stream' ? t('realtimeStreamDesc') : (lang === 'zh' ? '今日按匿名 IP 聚合的独立访客列表与访问指标' : 'Today\'s unique visitors aggregated by anonymous IP and activity metrics')"></p>
            </div>

            <div class="flex items-center gap-2.5 shrink-0">
                <!-- Auto-refresh switch (only in stream view) -->
                <button
                    x-show="visitorViewMode === 'stream'"
                    @click="toggleAutoRefreshStream()"
                    type="button"
                    class="inline-flex items-center gap-2 rounded-lg border px-3 py-1.5 text-xs font-medium transition-all"
                    :class="autoRefreshStream ? 'border-green-300 bg-green-50 text-green-700 shadow-xs' : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'">
                    <span class="h-2 w-2 rounded-full" :class="autoRefreshStream ? 'bg-green-500' : 'bg-gray-400'"></span>
                    <span x-text="t('autoRefresh')"></span>
                </button>

                <!-- Refresh button -->
                <button
                    @click="visitorViewMode === 'ip' ? loadVisitors(selectedProject.id, visitorsPage.page || 1, true) : loadVisitStream(selectedProject.id)"
                    type="button"
                    class="inline-flex items-center gap-1.5 rounded-lg border border-purple-200 bg-white px-3 py-1.5 text-xs font-medium text-purple-700 hover:bg-purple-50 transition-colors shadow-xs">
                    <svg class="w-3.5 h-3.5" :class="(visitorViewMode === 'ip' ? loadingVisitors : loadingVisitStream) ? 'animate-spin' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span x-text="t('refreshNow')"></span>
                </button>

                <!-- Count badge -->
                <span class="font-mono text-xs text-gray-400" x-show="visitorViewMode === 'stream' && visitStream.length > 0" x-text="lang === 'zh' ? `共 ${getFilteredVisitStream().length} 条访问记录` : `${getFilteredVisitStream().length} items`"></span>
                <span class="font-mono text-xs text-gray-400" x-show="visitorViewMode === 'ip' && visitorsPage.total > 0" x-text="lang === 'zh' ? `共 ${visitorsPage.total} 个 IP` : `${visitorsPage.total} IPs`"></span>
            </div>
        </div>

        <!-- ======================================================== -->
        <!-- VIEW 1: 实时访问流水 (STREAM VIEW) -->
        <!-- ======================================================== -->
        <div x-show="visitorViewMode === 'stream'">
            <!-- Stream Filter Pills: [ 全部 ] [ 👤 人类访客 ] [ 🤖 AI 智能体 ] -->
            <div class="flex items-center gap-2 mb-4">
                <button
                    @click="streamFilter = 'all'"
                    type="button"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium transition-all"
                    :class="streamFilter === 'all' ? 'bg-purple-600 text-white shadow-xs font-semibold' : 'bg-gray-100 text-gray-600 hover:bg-gray-200/80'">
                    <span x-text="t('filterAll')"></span>
                </button>
                <button
                    @click="streamFilter = 'human'"
                    type="button"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium transition-all"
                    :class="streamFilter === 'human' ? 'bg-purple-600 text-white shadow-xs font-semibold' : 'bg-gray-100 text-gray-600 hover:bg-gray-200/80'">
                    <span x-text="t('filterHuman')"></span>
                </button>
                <button
                    @click="streamFilter = 'ai'"
                    type="button"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium transition-all"
                    :class="streamFilter === 'ai' ? 'bg-purple-600 text-white shadow-xs font-semibold' : 'bg-gray-100 text-gray-600 hover:bg-gray-200/80'">
                    <span x-text="t('filterAI')"></span>
                </button>
            </div>

            <!-- Loading spinner for first load -->
            <template x-if="loadingVisitStream && visitStream.length === 0">
                <div class="text-center py-12">
                    <div class="animate-spin w-6 h-6 border-2 border-purple-200 border-t-purple-600 rounded-full mx-auto mb-3"></div>
                    <p class="text-xs text-gray-500" x-text="t('loading')"></p>
                </div>
            </template>

            <!-- Realtime Stream Table -->
            <div x-show="visitStream.length > 0 && getFilteredVisitStream().length > 0" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-100">
                    <thead>
                        <tr class="text-left text-xs uppercase tracking-wide text-gray-400">
                            <th class="py-3 pr-4 font-medium" x-text="t('visitTime')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('visitorLocation')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('sourceAndKeyword')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('visitedPath')"></th>
                            <th class="py-3 font-medium" x-text="t('deviceAndBrowser')"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <template x-for="item in getFilteredVisitStream()" :key="item.id || item.timestamp + item.maskedIp">
                            <tr class="align-top hover:bg-gray-50/80 transition-colors">
                                <!-- 1. 访问时间 (HH:mm:ss) -->
                                <td class="py-3.5 pr-4 whitespace-nowrap">
                                    <div class="font-mono text-sm font-semibold text-gray-800" x-text="item.timeStr || formatTimeOnly(item.timestamp)"></div>
                                    <div class="text-[11px] text-gray-400 font-mono mt-0.5" x-text="formatDateOnly(item.timestamp)"></div>
                                </td>

                                <!-- 2. 访客 IP 及归属地 (如 114.240.*.* 中国·北京) -->
                                <td class="py-3.5 pr-4">
                                    <div class="font-mono text-xs font-semibold text-gray-800 tracking-tight" x-text="item.maskedIp || '—'"></div>
                                    <div class="text-xs text-gray-500 mt-0.5" x-text="formatLocationParts(item.country, item.region, item.city)"></div>
                                </td>

                                <!-- 3. 来源类型与搜索词/外链 / AI 徽章 -->
                                <td class="py-3.5 pr-4 max-w-sm">
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        <!-- Purple AI Badge -->
                                        <template x-if="item.isAiAgent">
                                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                                                <span x-text="item.aiName ? `🤖 AI: ${item.aiName}` : (t('aiAgentBadge') || '🤖 AI Agent')"></span>
                                            </span>
                                        </template>

                                        <!-- Regular Source Category Badge -->
                                        <template x-if="!item.isAiAgent">
                                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium border"
                                                  :class="formatSourceCategoryBadge(item.sourceCategory)">
                                                <span x-text="formatSourceName(item.sourceName) || formatSourceCategory(item.sourceCategory)"></span>
                                            </span>
                                        </template>

                                        <!-- Search Keyword -->
                                        <template x-if="item.searchKeyword">
                                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs bg-indigo-50 text-indigo-700 font-medium border border-indigo-200">
                                                <svg class="w-3 h-3 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                                <span x-text="`[${item.searchKeyword}]`"></span>
                                            </span>
                                        </template>
                                    </div>

                                    <!-- External Source URL if present -->
                                    <template x-if="item.sourceUrl && item.sourceCategory !== 'direct'">
                                        <div class="mt-1">
                                            <a :href="item.sourceUrl.startsWith('http') ? item.sourceUrl : `https://${item.sourceUrl}`"
                                               target="_blank"
                                               rel="noopener noreferrer"
                                               class="text-xs text-purple-600 hover:text-purple-800 hover:underline inline-flex items-center gap-1 font-mono truncate max-w-xs"
                                               :title="item.sourceUrl">
                                                <span class="truncate" x-text="item.sourceUrl"></span>
                                                <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                            </a>
                                        </div>
                                    </template>
                                </td>

                                <!-- 4. 受访页面 (路径与页面名称) -->
                                <td class="py-3.5 pr-4">
                                    <span class="font-mono text-xs font-medium text-gray-800 bg-gray-50 px-2 py-1 rounded border border-gray-200/80 break-all inline-block"
                                          :title="item.path"
                                          x-text="item.path || '/'"></span>
                                </td>

                                <!-- 5. 终端设备 (设备类型、操作系统/浏览器) -->
                                <td class="py-3.5">
                                    <div class="text-xs font-semibold text-gray-800 capitalize" x-text="item.deviceType || '—'"></div>
                                    <div class="text-xs text-gray-400 capitalize mt-0.5" x-text="item.browser || '—'"></div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Filtered Empty State (visitStream has items, but current filter matches none) -->
            <div x-show="visitStream.length > 0 && getFilteredVisitStream().length === 0" class="text-center py-12">
                <p class="text-sm text-gray-500 font-medium" x-text="lang === 'zh' ? '当前筛选条件下暂无访问记录' : 'No visits match the selected filter.'"></p>
                <button @click="streamFilter = 'all'" type="button" class="mt-2 text-xs text-purple-600 hover:underline" x-text="lang === 'zh' ? '查看全部访客' : 'Show all visits'"></button>
            </div>

            <!-- Total Empty State for Visit Stream -->
            <div x-show="!loadingVisitStream && visitStream.length === 0" class="text-center py-12">
                <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p class="text-sm text-gray-500 font-medium" x-text="t('visitStreamEmpty')"></p>
                <p class="text-xs text-gray-400 mt-1" x-text="lang === 'zh' ? '开启自动刷新，访问被统计站点时流水将实时展示在此' : 'Enable auto-refresh to see visitor accesses appear here in real time'"></p>
            </div>
        </div>

        <!-- ======================================================== -->
        <!-- VIEW 2: 今日 IP 访问列表 (IP VISITORS VIEW) -->
        <!-- ======================================================== -->
        <div x-show="visitorViewMode === 'ip'">
            <!-- Loading spinner for first load -->
            <template x-if="loadingVisitors && (!visitorsPage.items || visitorsPage.items.length === 0)">
                <div class="text-center py-12">
                    <div class="animate-spin w-6 h-6 border-2 border-purple-200 border-t-purple-600 rounded-full mx-auto mb-3"></div>
                    <p class="text-xs text-gray-500" x-text="t('loading')"></p>
                </div>
            </template>

            <!-- IP Visitors Table -->
            <div x-show="visitorsPage && visitorsPage.items && visitorsPage.items.length > 0" class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-100">
                    <thead>
                        <tr class="text-left text-xs uppercase tracking-wide text-gray-400">
                            <th class="py-3 pr-4 font-medium" x-text="t('ipAddress')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('visitorLocation')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('pvHits')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('firstSeen')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('lastSeen')"></th>
                            <th class="py-3 pr-4 font-medium" x-text="t('recentPage')"></th>
                            <th class="py-3 font-medium" x-text="t('deviceAndBrowser')"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <template x-for="item in visitorsPage.items" :key="item.visitorId || item.ip">
                            <tr class="align-top hover:bg-gray-50/80 transition-colors">
                                <!-- 1. Masked IP -->
                                <td class="py-3.5 pr-4 whitespace-nowrap">
                                    <div class="font-mono text-xs font-semibold text-gray-800 tracking-tight" x-text="item.ip || '—'"></div>
                                </td>

                                <!-- 2. Location -->
                                <td class="py-3.5 pr-4">
                                    <div class="text-xs text-gray-700" x-text="formatVisitorLocation(item) || formatLocationParts(item.country, item.region, item.city) || '—'"></div>
                                </td>

                                <!-- 3. PV Hits -->
                                <td class="py-3.5 pr-4 whitespace-nowrap">
                                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200" x-text="item.requests || 1"></span>
                                </td>

                                <!-- 4. First Seen -->
                                <td class="py-3.5 pr-4 whitespace-nowrap">
                                    <div class="font-mono text-xs font-semibold text-gray-800" x-text="formatTimeOnly(item.firstSeenAt)"></div>
                                    <div class="text-[11px] text-gray-400 font-mono mt-0.5" x-text="formatDateOnly(item.firstSeenAt)"></div>
                                </td>

                                <!-- 5. Last Seen -->
                                <td class="py-3.5 pr-4 whitespace-nowrap">
                                    <div class="font-mono text-xs font-semibold text-gray-800" x-text="formatTimeOnly(item.lastSeenAt)"></div>
                                    <div class="text-[11px] text-gray-400 font-mono mt-0.5" x-text="formatDateOnly(item.lastSeenAt)"></div>
                                </td>

                                <!-- 6. Recent Page -->
                                <td class="py-3.5 pr-4">
                                    <span class="font-mono text-xs font-medium text-gray-800 bg-gray-50 px-2 py-1 rounded border border-gray-200/80 break-all inline-block"
                                          :title="item.path"
                                          x-text="item.path || '/'"></span>
                                </td>

                                <!-- 7. Device & Browser -->
                                <td class="py-3.5">
                                    <div class="text-xs font-semibold text-gray-800 capitalize" x-text="item.deviceType || '—'"></div>
                                    <div class="text-xs text-gray-400 capitalize mt-0.5" x-text="item.browser || '—'"></div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <!-- Pagination Controls -->
                <div class="flex items-center justify-between border-t border-gray-100 pt-4 mt-4">
                    <div class="text-xs text-gray-500">
                        <span x-text="lang === 'zh' ? `第 ${visitorsPage.page} / ${visitorsPage.totalPages || 1} 页 (共 ${visitorsPage.total} 条)` : `Page ${visitorsPage.page} of ${visitorsPage.totalPages || 1} (${visitorsPage.total} items)`"></span>
                    </div>
                    <div class="flex items-center gap-2" x-show="visitorsPage.totalPages > 1">
                        <button
                            @click="loadVisitors(selectedProject.id, visitorsPage.page - 1)"
                            :disabled="visitorsPage.page <= 1 || loadingVisitors"
                            type="button"
                            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-xs">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                            <span x-text="t('prevPage')"></span>
                        </button>
                        <button
                            @click="loadVisitors(selectedProject.id, visitorsPage.page + 1)"
                            :disabled="visitorsPage.page >= visitorsPage.totalPages || loadingVisitors"
                            type="button"
                            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 bg-white text-xs font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-xs">
                            <span x-text="t('nextPage')"></span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Empty state for IP Visitors -->
            <div x-show="!loadingVisitors && (!visitorsPage.items || visitorsPage.items.length === 0)" class="text-center py-12">
                <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <p class="text-sm text-gray-500 font-medium" x-text="t('noIPVisitors')"></p>
                <p class="text-xs text-gray-400 mt-1" x-text="lang === 'zh' ? '今日尚无独立 IP 访问记录，访问产生的 IP 将在此处汇总' : 'No unique IP records today; visits will be aggregated here.'"></p>
            </div>
        </div>
    </div>
</div>
