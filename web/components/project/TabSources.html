<div x-show="projectTab === 'sources'" class="space-y-6">
    <!-- 3. 流量来源与渠道分析 (3 Clear Blocks: 来源大类占比, 搜索引擎排行榜 Top 5, 外部来源页面 Top 10) -->
    <div class="space-y-6">
        <!-- Block 1: 来源大类占比 (搜索引擎 %, 外部链接 %, 直接访问 %, 社媒/AI/其他 %) -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-4 mb-4">
                <div>
                    <h3 class="font-semibold text-gray-900 text-base" x-text="t('trafficCategoryDistribution')"></h3>
                    <p class="text-xs text-gray-500 mt-0.5" x-text="t('visitSourcesHint')"></p>
                </div>
                <span class="text-xs font-mono text-gray-500" x-text="`Total: ${getTrafficCategories().total.toLocaleString()}`"></span>
            </div>

            <!-- Stacked Proportion Bar -->
            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden flex mb-5">
                <div class="bg-blue-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().search.pct}%`" :title="`Search: ${getTrafficCategories().search.pct}%`"></div>
                <div class="bg-emerald-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().referral.pct}%`" :title="`Referral: ${getTrafficCategories().referral.pct}%`"></div>
                <div class="bg-slate-400 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().direct.pct}%`" :title="`Direct: ${getTrafficCategories().direct.pct}%`"></div>
                <div class="bg-purple-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().other.pct}%`" :title="`Social/AI/Other: ${getTrafficCategories().other.pct}%`"></div>
            </div>

            <!-- 4 Categories Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- 搜索引擎 -->
                <div class="rounded-xl border border-blue-100 bg-blue-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-blue-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span x-text="t('searchEngines')"></span>
                        </span>
                        <span class="text-xs font-bold text-blue-700 font-mono" x-text="`${getTrafficCategories().search.pct}%`"></span>
                    </div>
                    <div class="text-xl font-bold text-blue-950 font-mono mt-1" x-text="getTrafficCategories().search.count.toLocaleString()"></div>
                </div>

                <!-- 外部链接 -->
                <div class="rounded-xl border border-emerald-100 bg-emerald-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-emerald-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span x-text="t('externalLinks')"></span>
                        </span>
                        <span class="text-xs font-bold text-emerald-700 font-mono" x-text="`${getTrafficCategories().referral.pct}%`"></span>
                    </div>
                    <div class="text-xl font-bold text-emerald-950 font-mono mt-1" x-text="getTrafficCategories().referral.count.toLocaleString()"></div>
                </div>

                <!-- 直接访问 -->
                <div class="rounded-xl border border-slate-200 bg-slate-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-slate-800 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                            <span x-text="t('directTraffic')"></span>
                        </span>
                        <span class="text-xs font-bold text-slate-700 font-mono" x-text="`${getTrafficCategories().direct.pct}%`"></span>
                    </div>
                    <div class="text-xl font-bold text-slate-900 font-mono mt-1" x-text="getTrafficCategories().direct.count.toLocaleString()"></div>
                </div>

                <!-- 社媒/AI/其他 -->
                <div class="rounded-xl border border-purple-100 bg-purple-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-purple-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                            <span x-text="lang === 'zh' ? '社媒/AI/其他' : 'Social / AI / Other'"></span>
                        </span>
                        <span class="text-xs font-bold text-purple-700 font-mono" x-text="`${getTrafficCategories().other.pct}%`"></span>
                    </div>
                    <div class="text-xl font-bold text-purple-950 font-mono mt-1" x-text="getTrafficCategories().other.count.toLocaleString()"></div>
                </div>
            </div>
        </div>

        <!-- 2 Column Grid: Block 2 & Block 3 -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Block 2: 搜索引擎排行榜 Top 5 + 捕获的搜索词 -->
            <div class="bg-white rounded-xl shadow-sm p-6 stat-card flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between gap-2 mb-4">
                        <h3 class="font-semibold text-gray-900 text-base flex items-center gap-2">
                            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <span x-text="t('topSearchEngines')"></span>
                        </h3>
                    </div>

                    <!-- Top 5 Search Engines List -->
                    <div class="space-y-3" x-show="getTopSearchEngines(5).length > 0">
                        <template x-for="(engine, index) in getTopSearchEngines(5)" :key="engine.key">
                            <div class="flex items-center justify-between gap-3 text-sm">
                                <div class="flex items-center gap-2 min-w-0 flex-1">
                                    <span class="inline-flex h-5 w-5 items-center justify-center rounded-full text-xs font-bold shrink-0"
                                          :class="index === 0 ? 'bg-amber-100 text-amber-800' : (index === 1 ? 'bg-slate-200 text-slate-700' : (index === 2 ? 'bg-orange-100 text-orange-800' : 'bg-gray-100 text-gray-600'))"
                                          x-text="index + 1"></span>
                                    <span class="font-medium text-gray-800 truncate" x-text="engine.name"></span>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <div class="w-24 bg-gray-100 rounded-full h-2 overflow-hidden">
                                        <div class="bg-blue-500 h-full rounded-full" :style="`width: ${engine.pct}%`"></div>
                                    </div>
                                    <span class="font-mono text-xs font-semibold text-gray-700 w-10 text-right" x-text="engine.count.toLocaleString()"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <p x-show="getTopSearchEngines(5).length === 0" class="text-xs text-gray-400 py-4 text-center" x-text="lang === 'zh' ? '暂无搜索引擎来源数据' : 'No search engine data recorded yet'"></p>

                    <!-- Search Keywords Sub-section -->
                    <div class="mt-6 pt-4 border-t border-gray-100">
                        <div class="flex items-center justify-between mb-3">
                            <h4 class="text-xs font-semibold text-gray-700 uppercase tracking-wider flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                                <span x-text="t('searchKeywords')"></span>
                            </h4>
                        </div>
                        <div class="flex flex-wrap gap-2" x-show="getTopSearchKeywords(8).length > 0">
                            <template x-for="item in getTopSearchKeywords(8)" :key="item.term">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs bg-indigo-50 text-indigo-700 border border-indigo-100">
                                    <span class="font-medium" x-text="item.term"></span>
                                    <span class="text-[10px] bg-indigo-200/70 text-indigo-900 px-1 rounded-full font-mono font-semibold" x-text="item.count"></span>
                                </span>
                            </template>
                        </div>
                        <p x-show="getTopSearchKeywords(8).length === 0" class="text-xs text-gray-400 py-2" x-text="t('noKeywordsCaptured')"></p>
                    </div>
                </div>
            </div>

            <!-- Block 3: 外部来源页面 Top 10 (带来源页面链接，支持一键点击外链跳转) -->
            <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
                <div class="flex items-center justify-between gap-2 mb-4">
                    <h3 class="font-semibold text-gray-900 text-base flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        <span x-text="t('topExternalLinks')"></span>
                    </h3>
                </div>

                <div class="space-y-2.5" x-show="getTopExternalReferrers(10).length > 0">
                    <template x-for="(item, index) in getTopExternalReferrers(10)" :key="item.url">
                        <div class="flex items-center justify-between gap-3 text-sm p-1.5 rounded-lg hover:bg-gray-50 transition-colors">
                            <div class="flex items-center gap-2 min-w-0 flex-1">
                                <span class="text-xs font-mono text-gray-400 w-4 text-right shrink-0" x-text="index + 1"></span>
                                <span class="text-gray-700 truncate text-xs font-mono" :title="item.url" x-text="item.url"></span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="font-mono text-xs font-semibold text-gray-700" x-text="item.count.toLocaleString()"></span>
                                <a :href="item.url.startsWith('http') ? item.url : `https://${item.url}`"
                                   target="_blank"
                                   rel="noopener noreferrer"
                                   class="p-1 rounded text-purple-600 hover:text-purple-800 hover:bg-purple-50 transition-colors"
                                   title="Open link">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                </a>
                            </div>
                        </div>
                    </template>
                </div>
                <p x-show="getTopExternalReferrers(10).length === 0" class="text-xs text-gray-400 py-6 text-center" x-text="t('noExternalReferrers')"></p>
            </div>
        </div>
    </div>

    <!-- 核心流量构成 (带分页) -->
    <div class="grid md:grid-cols-2 gap-6">

        <!-- siteSearch -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-start justify-between gap-2 mb-4">
                <div>
                    <h3 class="font-semibold text-gray-900" x-text="t('siteSearch')"></h3>
                    <p class="text-xs text-gray-500 mt-1" x-text="t('siteSearchHint')"></p>
                </div>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.siteSearches) > 8">
                    <button @click="changeBreakdownPage('siteSearches', -1, projectAnalysis.breakdowns.siteSearches)" :disabled="(breakdownPages.siteSearches || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.siteSearches || 1} / ${getTotalPages(projectAnalysis.breakdowns.siteSearches, 8)}`"></span>
                    <button @click="changeBreakdownPage('siteSearches', 1, projectAnalysis.breakdowns.siteSearches)" :disabled="(breakdownPages.siteSearches || 1) >= getTotalPages(projectAnalysis.breakdowns.siteSearches, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.siteSearches, breakdownPages.siteSearches || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.siteSearches, breakdownPages.siteSearches || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 truncate flex-1 text-sm" :title="entry[0]" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-teal-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.siteSearches)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.siteSearches) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>

        <!-- Top Countries -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900" x-text="t('topCountries')"></h3>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.countries) > 8">
                    <button @click="changeBreakdownPage('countries', -1, projectAnalysis.breakdowns.countries)" :disabled="(breakdownPages.countries || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.countries || 1} / ${getTotalPages(projectAnalysis.breakdowns.countries, 8)}`"></span>
                    <button @click="changeBreakdownPage('countries', 1, projectAnalysis.breakdowns.countries)" :disabled="(breakdownPages.countries || 1) >= getTotalPages(projectAnalysis.breakdowns.countries, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.countries, breakdownPages.countries || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.countries, breakdownPages.countries || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-purple-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.countries)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.countries) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>

        <!-- Top Devices -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900" x-text="t('topDevices')"></h3>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.devices) > 8">
                    <button @click="changeBreakdownPage('devices', -1, projectAnalysis.breakdowns.devices)" :disabled="(breakdownPages.devices || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.devices || 1} / ${getTotalPages(projectAnalysis.breakdowns.devices, 8)}`"></span>
                    <button @click="changeBreakdownPage('devices', 1, projectAnalysis.breakdowns.devices)" :disabled="(breakdownPages.devices || 1) >= getTotalPages(projectAnalysis.breakdowns.devices, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.devices, breakdownPages.devices || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.devices, breakdownPages.devices || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.devices)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.devices) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>

        <!-- Top Browsers -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card md:col-span-2">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900" x-text="t('topBrowsers')"></h3>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.browsers) > 8">
                    <button @click="changeBreakdownPage('browsers', -1, projectAnalysis.breakdowns.browsers)" :disabled="(breakdownPages.browsers || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.browsers || 1} / ${getTotalPages(projectAnalysis.breakdowns.browsers, 8)}`"></span>
                    <button @click="changeBreakdownPage('browsers', 1, projectAnalysis.breakdowns.browsers)" :disabled="(breakdownPages.browsers || 1) >= getTotalPages(projectAnalysis.breakdowns.browsers, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="grid sm:grid-cols-2 gap-x-8 gap-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.browsers, breakdownPages.browsers || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.browsers, breakdownPages.browsers || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-28 bg-gray-200 rounded-full h-2">
                                <div class="bg-orange-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.browsers)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>

            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.browsers) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>
    </div>


</div>
