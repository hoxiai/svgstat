<!-- ======================================================== -->
<!-- TAB 1: 流量总览 (OVERVIEW - 默认核心页面) -->
<!-- ======================================================== -->
<div x-show="projectTab === 'overview'" class="space-y-6">
    <!-- 实时概览 -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex items-center justify-between gap-4 mb-4">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('realtimeOverview')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="projectRealtime.lastSeenAt ? `${t('lastRequest')} ${formatDateTime(projectRealtime.lastSeenAt)}` : t('realtimeWaiting')"></p>
            </div>
            <span class="inline-flex items-center gap-2 text-sm text-green-700 font-medium">
                <span class="h-2.5 w-2.5 rounded-full bg-green-500 animate-pulse"></span>
                <span x-text="t('live')"></span>
            </span>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="rounded-lg bg-purple-50 p-4"><div class="text-3xl font-bold text-purple-600" x-text="projectRealtime.pv5 || 0"></div><div class="text-sm text-gray-600" x-text="t('pageviews5m')"></div></div>
            <div class="rounded-lg bg-blue-50 p-4"><div class="text-3xl font-bold text-blue-600" x-text="projectRealtime.visitors5 || 0"></div><div class="text-sm text-gray-600" x-text="t('visitors5m')"></div></div>
            <div class="rounded-lg bg-purple-50 p-4"><div class="text-3xl font-bold text-purple-600" x-text="projectRealtime.pv30 || 0"></div><div class="text-sm text-gray-600" x-text="t('pageviews30m')"></div></div>
            <div class="rounded-lg bg-blue-50 p-4"><div class="text-3xl font-bold text-blue-600" x-text="projectRealtime.visitors30 || 0"></div><div class="text-sm text-gray-600" x-text="t('visitors30m')"></div></div>
        </div>
        <div class="grid md:grid-cols-2 gap-6 mt-5" x-show="getTotalCount(projectRealtime.sources) > 0 || getTotalCount(projectRealtime.pages) > 0">
            <div>
                <h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('realtimeSources')"></h4>
                <div class="space-y-2">
                    <template x-for="entry in getSortedEntries(projectRealtime.sources, 5)" :key="entry[0]">
                        <div class="flex items-center justify-between gap-3 text-sm">
                            <span class="text-gray-700 truncate" x-text="entry[0]"></span>
                            <span class="text-gray-500 font-medium shrink-0" x-text="entry[1]"></span>
                        </div>
                    </template>
                </div>
            </div>
            <div>
                <h4 class="text-sm font-medium text-gray-800 mb-3" x-text="t('realtimePages')"></h4>
                <div class="space-y-2">
                    <template x-for="entry in getSortedEntries(projectRealtime.pages, 5)" :key="entry[0]">
                        <div class="flex items-center justify-between gap-3 text-sm">
                            <span class="text-gray-700 truncate font-mono" :title="entry[0]" x-text="entry[0]"></span>
                            <span class="text-gray-500 font-medium shrink-0" x-text="entry[1]"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. 今日核心指标 Hero Cards (Golden Trio + 人均浏览量) -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex items-center justify-between gap-4 mb-5">
            <div>
                <h3 class="font-semibold text-gray-900 text-base" x-text="t('todayOverview')"></h3>
                <p class="text-xs text-gray-400 mt-0.5" x-text="projectOverview?.date ? `${projectOverview.date} (UTC)` : ''"></p>
            </div>
            <div class="flex items-center gap-3">
                <template x-if="projectOverview?.todayAi > 0">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200 shadow-2xs">
                        <span>🤖</span>
                        <span x-text="lang === 'zh' ? `今日 AI 探测: ${projectOverview.todayAi} 次` : `AI Visits: ${projectOverview.todayAi}`"></span>
                    </span>
                </template>
                <div x-show="(!projectOverview && loadingOverview) || (!projectStats?.pv && loadingStats)" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div>
            </div>
        </div>
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- 今日 PV -->
            <div class="bg-gradient-to-br from-purple-50/80 to-purple-100/50 rounded-xl p-4 border border-purple-100/80 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('todayPV')"></span>
                        <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                    </div>
                    <div class="text-3xl font-extrabold text-purple-700 mt-2 font-mono tracking-tight" x-text="projectOverview?.pv != null ? projectOverview.pv.toLocaleString() : (projectStats.pv || 0).toLocaleString()"></div>
                </div>
                <div class="mt-4 pt-3 border-t border-purple-100/60 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-gray-500" x-text="t('yesterdaySamePeriod')"></span>
                        <span class="font-medium px-1.5 py-0.5 rounded border text-[11px]"
                              :class="getPercentageChangeColorClass(projectOverview?.changes?.pv)"
                              x-text="formatPercentageChangeWithArrow(projectOverview?.changes?.pv)"></span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span x-text="t('yesterdayFullDay')"></span>
                        <span class="font-mono font-medium text-gray-700" x-text="projectOverview?.yesterdayFull?.pv != null ? projectOverview.yesterdayFull.pv.toLocaleString() : '—'"></span>
                    </div>
                </div>
            </div>

            <!-- 今日 UV -->
            <div class="bg-gradient-to-br from-blue-50/80 to-blue-100/50 rounded-xl p-4 border border-blue-100/80 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('todayUV')"></span>
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    </div>
                    <div class="text-3xl font-extrabold text-blue-700 mt-2 font-mono tracking-tight" x-text="projectOverview?.uv != null ? projectOverview.uv.toLocaleString() : (projectStats.uv || 0).toLocaleString()"></div>
                </div>
                <div class="mt-4 pt-3 border-t border-blue-100/60 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-gray-500" x-text="t('yesterdaySamePeriod')"></span>
                        <span class="font-medium px-1.5 py-0.5 rounded border text-[11px]"
                              :class="getPercentageChangeColorClass(projectOverview?.changes?.uv)"
                              x-text="formatPercentageChangeWithArrow(projectOverview?.changes?.uv)"></span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span x-text="t('yesterdayFullDay')"></span>
                        <span class="font-mono font-medium text-gray-700" x-text="projectOverview?.yesterdayFull?.uv != null ? projectOverview.yesterdayFull.uv.toLocaleString() : '—'"></span>
                    </div>
                </div>
            </div>

            <!-- 今日 IP -->
            <div class="bg-gradient-to-br from-teal-50/80 to-teal-100/50 rounded-xl p-4 border border-teal-100/80 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('todayIP')"></span>
                        <span class="w-2 h-2 rounded-full bg-teal-500"></span>
                    </div>
                    <div class="text-3xl font-extrabold text-teal-700 mt-2 font-mono tracking-tight" x-text="projectOverview?.ip != null ? projectOverview.ip.toLocaleString() : (projectStats.ip || 0).toLocaleString()"></div>
                </div>
                <div class="mt-4 pt-3 border-t border-teal-100/60 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-gray-500" x-text="t('yesterdaySamePeriod')"></span>
                        <span class="font-medium px-1.5 py-0.5 rounded border text-[11px]"
                              :class="getPercentageChangeColorClass(projectOverview?.changes?.ip)"
                              x-text="formatPercentageChangeWithArrow(projectOverview?.changes?.ip)"></span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span x-text="t('yesterdayFullDay')"></span>
                        <span class="font-mono font-medium text-gray-700" x-text="projectOverview?.yesterdayFull?.ip != null ? projectOverview.yesterdayFull.ip.toLocaleString() : '—'"></span>
                    </div>
                </div>
            </div>

            <!-- 人均浏览量 (PV/UV) -->
            <div class="bg-gradient-to-br from-amber-50/80 to-amber-100/50 rounded-xl p-4 border border-amber-100/80 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider" x-text="t('avgPVPerUser')"></span>
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    </div>
                    <div class="text-3xl font-extrabold text-amber-700 mt-2 font-mono tracking-tight" x-text="projectOverview?.avgPageviewsPerUser != null ? projectOverview.avgPageviewsPerUser.toFixed(2) : (projectOverview?.uv > 0 ? (projectOverview.pv / projectOverview.uv).toFixed(2) : '0.00')"></div>
                </div>
                <div class="mt-4 pt-3 border-t border-amber-100/60 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-gray-500">PV / UV</span>
                        <span class="font-medium text-amber-700 bg-amber-100/80 px-1.5 py-0.5 rounded text-[11px]">Ratio</span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500">
                        <span x-text="t('yesterdayFullDay')"></span>
                        <span class="font-mono font-medium text-gray-700" x-text="projectOverview?.yesterdayFull?.uv > 0 ? (projectOverview.yesterdayFull.pv / projectOverview.yesterdayFull.uv).toFixed(2) : '—'"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 今日 24 小时分时走势图 (24-Hour Trend Comparison) -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
            <div>
                <div class="flex items-center gap-2">
                    <h3 class="font-semibold text-gray-900 text-base" x-text="t('hourlyComparison')"></h3>
                    <span class="rounded-full bg-purple-50 px-2 py-0.5 text-xs font-medium text-purple-700 border border-purple-200" x-text="`0:00 - ${projectOverview?.currentHour != null ? projectOverview.currentHour : 23}:00`"></span>
                </div>
                <p class="text-xs text-gray-500 mt-1" x-text="t('hourlyComparisonDesc')"></p>
            </div>
            <!-- Switcher buttons [ PV ] [ UV ] [ IP ] -->
            <div class="flex items-center gap-1.5 bg-gray-100/80 p-1 rounded-lg border border-gray-200/60">
                <template x-for="metric in ['pv', 'uv', 'ip']" :key="metric">
                    <button
                        @click="setHourlyMetric(metric)"
                        class="px-3.5 py-1.5 text-xs font-semibold rounded-md transition-all uppercase"
                        :class="hourlyMetric === metric ? 'bg-purple-600 text-white shadow-xs' : 'text-gray-600 hover:text-gray-900 hover:bg-white/60'"
                        x-text="metric">
                    </button>
                </template>
            </div>
        </div>

        <!-- 24h Dual Line Chart SVG -->
        <div class="rounded-xl border border-gray-100 bg-gradient-to-b from-gray-50/70 to-white p-4 overflow-hidden">
            <svg viewBox="0 0 1000 240" class="w-full h-64" preserveAspectRatio="none" role="img" :aria-label="t('hourlyComparison')">
                <!-- Grid Lines -->
                <line x1="0" y1="205" x2="1000" y2="205" stroke="#e5e7eb" stroke-width="1.5"></line>
                <line x1="0" y1="147" x2="1000" y2="147" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4 4"></line>
                <line x1="0" y1="88" x2="1000" y2="88" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4 4"></line>
                <line x1="0" y1="30" x2="1000" y2="30" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="4 4"></line>

                <!-- Vertical Hour Marker Lines (every 3 hours: 0, 3, 6, 9, 12, 15, 18, 21, 24) -->
                <template x-for="h in [0, 3, 6, 9, 12, 15, 18, 21, 24]" :key="h">
                    <line :x1="(h / 24) * 1000" y1="30" :x2="(h / 24) * 1000" y2="205" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3 3"></line>
                </template>

                <!-- Yesterday Full Day Line (Dashed) -->
                <polyline
                    :points="getHourlyYesterdayPoints(hourlyMetric)"
                    fill="none"
                    stroke="#94a3b8"
                    stroke-width="2.5"
                    stroke-dasharray="6 6"
                    vector-effect="non-scaling-stroke"
                    stroke-linejoin="round"
                    stroke-linecap="round">
                </polyline>

                <!-- Today Realtime Line (Solid) -->
                <polyline
                    :points="getHourlyTodayPoints(hourlyMetric)"
                    fill="none"
                    stroke="#7c3aed"
                    stroke-width="3.5"
                    vector-effect="non-scaling-stroke"
                    stroke-linejoin="round"
                    stroke-linecap="round">
                </polyline>
            </svg>

            <!-- Time Axis (00:00 to 24:00) -->
            <div class="flex items-center justify-between text-[11px] text-gray-400 font-mono mt-2 px-1">
                <span>00:00</span>
                <span>03:00</span>
                <span>06:00</span>
                <span>09:00</span>
                <span>12:00</span>
                <span>15:00</span>
                <span>18:00</span>
                <span>21:00</span>
                <span>24:00</span>
            </div>

            <!-- Legend & Info -->
            <div class="flex flex-wrap items-center justify-between gap-3 text-xs text-gray-600 mt-4 pt-3 border-t border-gray-100">
                <div class="flex items-center gap-6">
                    <span class="inline-flex items-center gap-2">
                        <span class="w-4 h-1 bg-purple-600 rounded-full"></span>
                        <span class="font-medium text-gray-800" x-text="t('todayRealtimeCurve')"></span>
                    </span>
                    <span class="inline-flex items-center gap-2">
                        <span class="w-4 h-0.5 border-t-2 border-dashed border-slate-400"></span>
                        <span class="text-gray-500" x-text="t('yesterdayBaselineCurve')"></span>
                    </span>
                </div>
                <div class="text-xs text-gray-400">
                    <span x-text="`${t('metricName')}: `"></span>
                    <strong class="uppercase text-purple-700 font-mono" x-text="hourlyMetric"></strong>
                    <span class="mx-1.5">·</span>
                    <span>Peak: </span>
                    <strong class="font-mono text-gray-700" x-text="getHourlyMax(hourlyMetric)"></strong>
                </div>
            </div>
        </div>
    </div>

    <!-- 流量趋势折线图 -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('trafficTrend')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="projectTrend.startDate && projectTrend.endDate ? `${formatTrendDate(projectTrend.startDate)} – ${formatTrendDate(projectTrend.endDate)}` : t('trendLoading')"></p>
            </div>
            <div class="flex items-center gap-2">
                <template x-for="days in [7, 30, 90]" :key="days">
                    <button
                        @click="setTrendDays(days)"
                        class="rounded-lg border px-3 py-1.5 text-sm transition-colors"
                        :class="trendDays === days ? 'border-purple-600 bg-purple-600 text-white font-medium' : 'border-gray-200 bg-white text-gray-600 hover:border-purple-300 hover:text-purple-600'"
                        x-text="`${days}${t('daysShort')}`">
                    </button>
                </template>
                <div x-show="loadingTrend" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full ml-2"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="rounded-lg bg-purple-50 p-3">
                <div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-purple-600" x-text="projectAnalysis.current.pv || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.pv == null ? 'text-gray-400' : (projectAnalysis.changes.pv >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.pv)"></span></div>
                <div class="text-xs text-gray-500" x-text="t('trendPV')"></div>
            </div>
            <div class="rounded-lg bg-blue-50 p-3">
                <div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-blue-600" x-text="projectAnalysis.current.uv || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.uv == null ? 'text-gray-400' : (projectAnalysis.changes.uv >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.uv)"></span></div>
                <div class="text-xs text-gray-500" x-text="t('trendUV')"></div>
            </div>
            <div class="rounded-lg bg-green-50 p-3">
                <div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-green-600" x-text="projectAnalysis.current.requests || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.requests == null ? 'text-gray-400' : (projectAnalysis.changes.requests >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.requests)"></span></div>
                <div class="text-xs text-gray-500" x-text="t('trendRequests')"></div>
            </div>
            <div class="rounded-lg bg-orange-50 p-3">
                <div class="flex items-start justify-between gap-2"><div class="text-2xl font-bold text-orange-600" x-text="projectAnalysis.current.bots || 0"></div><span class="text-xs font-medium" :class="projectAnalysis.changes.bots == null ? 'text-gray-400' : (projectAnalysis.changes.bots >= 0 ? 'text-green-600' : 'text-red-600')" x-text="formatChange(projectAnalysis.changes.bots)"></span></div>
                <div class="text-xs text-gray-500" x-text="t('bots')"></div>
            </div>
        </div>
        <p class="text-xs text-gray-400 mb-4" x-text="t('comparisonHint')"></p>

        <div class="rounded-xl border border-gray-100 bg-gray-50 p-4 overflow-hidden">
            <svg viewBox="0 0 1000 240" class="w-full h-60" preserveAspectRatio="none" role="img" :aria-label="t('trafficTrend')">
                <line x1="0" y1="220" x2="1000" y2="220" stroke="#e5e7eb" stroke-width="2"></line>
                <line x1="0" y1="110" x2="1000" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="8 8"></line>
                <polyline :points="getTrendPoints('requests')" fill="none" stroke="#22c55e" stroke-width="5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                <polyline :points="getTrendPoints('pv')" fill="none" stroke="#9333ea" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                <polyline :points="getTrendPoints('uv')" fill="none" stroke="#2563eb" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
            </svg>
            <div class="flex items-center justify-between text-xs text-gray-400 mt-2">
                <span x-text="formatTrendDate(projectTrend.startDate)"></span>
                <div class="flex flex-wrap justify-center gap-4 text-gray-600">
                    <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span><span x-text="t('trendPV')"></span></span>
                    <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span><span x-text="t('trendUV')"></span></span>
                    <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-green-500"></span><span x-text="t('trendRequests')"></span></span>
                </div>
                <span x-text="formatTrendDate(projectTrend.endDate)"></span>
            </div>
        </div>
    </div>

    <!-- 3. 流量来源与渠道分析 (3 Clear Blocks: 来源大类占比, 搜索引擎排行榜 Top 5, 外部来源页面 Top 10) -->
    <div class="space-y-6">
        <!-- Block 1: 来源大类占比 (搜索引擎 %, 外部链接 %, 直接访问 %, 社媒/AI/其他 %) -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-4 mb-4">
                <div>
                    <h3 class="font-semibold text-gray-900 text-base" x-text="t('trafficCategoryDistribution')"></h3>
                    <p class="text-xs text-gray-500 mt-0.5" x-text="t('visitSourcesHint')"></p>
                </div>
                <span class="text-xs font-mono text-gray-500" x-text="`Total: ${getTrafficCategories().total.toLocaleString()}`"></span>
            </div>

            <!-- Stacked Proportion Bar -->
            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden flex mb-5">
                <div class="bg-blue-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().search.pct}%`" :title="`Search: ${getTrafficCategories().search.pct}%`"></div>
                <div class="bg-emerald-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().referral.pct}%`" :title="`Referral: ${getTrafficCategories().referral.pct}%`"></div>
                <div class="bg-slate-400 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().direct.pct}%`" :title="`Direct: ${getTrafficCategories().direct.pct}%`"></div>
                <div class="bg-purple-500 h-full transition-all duration-300" :style="`width: ${getTrafficCategories().other.pct}%`" :title="`Social/AI/Other: ${getTrafficCategories().other.pct}%`"></div>
            </div>

            <!-- 4 Categories Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- 搜索引擎 -->
                <div class="rounded-xl border border-blue-100 bg-blue-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-blue-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span x-text="t('searchEngines')"></span>
                        </span>
                        <span class="text-xs font-bold text-blue-700 font-mono" x-text="`${getTrafficCategories().search.pct}%`"></span>
                    </div>
                    <div class="text-xl font-bold text-blue-950 font-mono mt-1" x-text="getTrafficCategories().search.count.toLocaleString()"></div>
                </div>

                <!-- 外部链接 -->
                <div class="rounded-xl border border-emerald-100 bg-emerald-50/50 p-4">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-medium text-emerald-900 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span x-text="t('externalLinks')"></span>
                        </span>

                    </button>
                    <span x-text="`${breakdownPages.countries || 1} / ${getTotalPages(projectAnalysis.breakdowns.countries, 8)}`"></span>
                    <button @click="changeBreakdownPage('countries', 1, projectAnalysis.breakdowns.countries)" :disabled="(breakdownPages.countries || 1) >= getTotalPages(projectAnalysis.breakdowns.countries, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.countries, breakdownPages.countries || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.countries, breakdownPages.countries || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-purple-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.countries)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.countries) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>

        <!-- Top Devices -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900" x-text="t('topDevices')"></h3>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.devices) > 8">
                    <button @click="changeBreakdownPage('devices', -1, projectAnalysis.breakdowns.devices)" :disabled="(breakdownPages.devices || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.devices || 1} / ${getTotalPages(projectAnalysis.breakdowns.devices, 8)}`"></span>
                    <button @click="changeBreakdownPage('devices', 1, projectAnalysis.breakdowns.devices)" :disabled="(breakdownPages.devices || 1) >= getTotalPages(projectAnalysis.breakdowns.devices, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.devices, breakdownPages.devices || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.devices, breakdownPages.devices || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-32 bg-gray-200 rounded-full h-2">
                                <div class="bg-green-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.devices)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.devices) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>

        <!-- Top Browsers -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card md:col-span-2">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900" x-text="t('topBrowsers')"></h3>
                <div class="flex items-center gap-1.5 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.browsers) > 8">
                    <button @click="changeBreakdownPage('browsers', -1, projectAnalysis.breakdowns.browsers)" :disabled="(breakdownPages.browsers || 1) <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.browsers || 1} / ${getTotalPages(projectAnalysis.breakdowns.browsers, 8)}`"></span>
                    <button @click="changeBreakdownPage('browsers', 1, projectAnalysis.breakdowns.browsers)" :disabled="(breakdownPages.browsers || 1) >= getTotalPages(projectAnalysis.breakdowns.browsers, 8)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="grid sm:grid-cols-2 gap-x-8 gap-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.browsers, breakdownPages.browsers || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.browsers, breakdownPages.browsers || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-4">
                        <span class="text-gray-700 text-sm truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-28 bg-gray-200 rounded-full h-2">
                                <div class="bg-orange-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.browsers)"></div>
                            </div>
                            <span class="text-sm text-gray-500 min-w-8 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.browsers) === 0" class="text-gray-500 text-center py-4 text-sm" x-text="t('noData')"></p>
        </div>
    </div>

    <!-- 问题与健康建议 (Issue Center) -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('issueCenterTitle')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="t('issueCenterHint')"></p>
            </div>
            <div class="flex items-center gap-3">
                <span class="rounded-full border px-3 py-1 text-xs font-medium" :class="getIssueStatusClass(issueReport.status)" x-text="t(`issueStatus_${issueReport.status}`)"></span>
                <div x-show="loadingIssues" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div>
            </div>
        </div>
        <div x-show="issueReport.issues.length" class="mt-5 space-y-3">
            <template x-for="issue in issueReport.issues" :key="`${issue.code}-${issue.subject}`">
                <div class="rounded-xl border p-4" :class="getIssueClass(issue.severity)">
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="rounded-full px-2 py-0.5 text-xs font-semibold uppercase" :class="issue.severity === 'critical' ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'" x-text="t(`issueSeverity_${issue.severity}`)"></span>
                                <h4 class="font-semibold text-gray-900" x-text="getIssueTitle(issue)"></h4>
                            </div>
                            <p class="mt-2 text-sm text-gray-700" x-text="getIssueAdvice(issue)"></p>
                        </div>
                        <div class="shrink-0 rounded-lg bg-white/70 px-3 py-2 text-right text-xs text-gray-500">
                            <div><span x-text="t('issueCurrent')"></span>: <strong class="text-gray-900" x-text="formatIssueValue(issue, 'current')"></strong></div>
                            <div><span x-text="t('issuePrevious')"></span>: <span x-text="formatIssueValue(issue, 'previous')"></span></div>
                            <div x-show="issue.changePercent != null" class="mt-1 font-medium" :class="issue.changePercent < 0 ? 'text-red-600' : 'text-amber-600'" x-text="formatChange(issue.changePercent)"></div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        <div x-show="!loadingIssues && issueReport.status === 'healthy'" class="mt-5 rounded-xl border border-green-100 bg-green-50 px-4 py-4 text-sm text-green-700" x-text="t('issueHealthyHint')"></div>
        <div x-show="!loadingIssues && issueReport.status === 'insufficient_data'" class="mt-5 rounded-xl border border-blue-100 bg-blue-50 px-4 py-4 text-sm text-blue-700" x-text="t('issueInsufficientHint')"></div>
    </div>
</div>
