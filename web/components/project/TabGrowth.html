<!-- ======================================================== -->
<!-- TAB 2: 转化与增长 (GROWTH) -->
<!-- ======================================================== -->
<div x-show="projectTab === 'growth'" class="space-y-6">
    <!-- 自定义事件分析 -->
    <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
        <div class="flex items-center justify-between gap-4 mb-5">
            <div>
                <h3 class="font-semibold text-gray-900" x-text="t('customEvents')"></h3>
                <p class="text-sm text-gray-500 mt-1" x-text="t('customEventsHint')"></p>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 text-xs text-gray-500" x-show="getTotalCount(eventReport.events) > eventsPageSize">
                    <button @click="changeListPage('eventsPage', -1, eventReport.events, eventsPageSize)" :disabled="eventsPage <= 1" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${eventsPage} / ${getTotalPages(eventReport.events, eventsPageSize)}`"></span>
                    <button @click="changeListPage('eventsPage', 1, eventReport.events, eventsPageSize)" :disabled="eventsPage >= getTotalPages(eventReport.events, eventsPageSize)" class="p-1 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div x-show="loadingConversions" class="animate-spin w-5 h-5 border-2 border-purple-200 border-purple-600 rounded-full"></div>
            </div>
        </div>

        <div class="overflow-x-auto" x-show="eventReport.events.length">
            <table class="w-full text-left">
                <thead class="text-xs uppercase text-gray-400 border-b">
                    <tr>
                        <th class="py-3 pr-4" x-text="t('eventName')"></th>
                        <th class="py-3 pr-4" x-text="t('eventCount')"></th>
                        <th class="py-3 pr-4" x-text="t('converters')"></th>
                        <th class="py-3 pr-4" x-text="t('conversionRate')"></th>
                        <th class="py-3 pr-4" x-text="t('topSource')"></th>
                        <th class="py-3" x-text="t('eventValue')"></th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <template x-for="event in getPaginatedList(eventReport.events, eventsPage, eventsPageSize)" :key="event.name">
                        <tr class="hover:bg-gray-50/60 transition-colors">
                            <td class="py-4 pr-4 font-mono text-sm text-purple-700 font-medium" x-text="event.name"></td>
                            <td class="py-4 pr-4 font-semibold" x-text="event.count"></td>
                            <td class="py-4 pr-4" x-text="event.visitors"></td>
                            <td class="py-4 pr-4 font-medium text-purple-600" x-text="formatPercent(event.rate)"></td>
                            <td class="py-4 pr-4 text-sm text-gray-600" x-text="getTopKey(event.sources)"></td>
                            <td class="py-4 text-sm text-gray-600" x-text="formatEventValues(event.values)"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <p x-show="!eventReport.events.length" class="text-gray-500 text-center py-6" x-text="t('noEvents')"></p>

        <!-- 选中事件趋势与下钻 -->
        <div x-show="eventReport.events.length" class="mt-6 rounded-xl border border-gray-100 bg-gray-50 p-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <div class="font-medium text-gray-900" x-text="t('eventTrend')"></div>
                    <div class="text-xs text-gray-500" x-text="t('eventTrendHint')"></div>
                </div>
                <select x-model="selectedEventName" class="rounded-lg border border-gray-200 bg-white px-3 py-2 font-mono text-sm">
                    <template x-for="event in eventReport.events" :key="event.name">
                        <option :value="event.name" x-text="event.name"></option>
                    </template>
                </select>
            </div>
            <svg viewBox="0 0 1000 230" class="w-full h-48" preserveAspectRatio="none" role="img" :aria-label="t('eventTrend')">
                <line x1="0" y1="220" x2="1000" y2="220" stroke="#e5e7eb" stroke-width="2"></line>
                <polyline :points="getEventTrendPoints('count')" fill="none" stroke="#7c3aed" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
                <polyline :points="getEventTrendPoints('visitors')" fill="none" stroke="#0ea5e9" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline>
            </svg>
            <div class="flex items-center justify-center gap-5 text-xs text-gray-600 mt-2">
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span><span x-text="t('eventCount')"></span></span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span><span x-text="t('converters')"></span></span>
            </div>
            <div x-show="getSelectedEventDetails().length" class="mt-5 border-t border-gray-200 pt-4">
                <div class="font-medium text-gray-900" x-text="t('eventDetails')"></div>
                <div class="text-xs text-gray-500 mt-1 mb-3" x-text="t('eventDetailsHint')"></div>
                <div class="grid md:grid-cols-2 gap-3">
                    <template x-for="([property, values]) in getSelectedEventDetails()" :key="property">
                        <div class="rounded-lg border border-gray-200 bg-white p-3">
                            <div class="mb-2 font-mono text-xs font-medium text-purple-700" x-text="property"></div>
                            <div class="space-y-1.5">
                                <template x-for="detail in values" :key="detail.value">
                                    <div class="flex items-center justify-between gap-4 text-sm">
                                        <span class="truncate text-gray-700" :title="detail.value" x-text="detail.value"></span>
                                        <span class="shrink-0 text-xs text-gray-500" x-text="`${detail.visitors} ${t('anonymousVisitors')}`"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <div class="mt-5 rounded-lg bg-gray-900 p-4 text-sm text-gray-100 font-mono overflow-x-auto whitespace-nowrap">
            window.svgstat('event', 'signup')<br>
            window.svgstat('event', 'purchase', { value: 99, currency: 'CNY' })
        </div>
    </div>

    <!-- 转化目标与漏斗 -->
    <div class="grid lg:grid-cols-2 gap-6">
        <!-- 转化目标 -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <h3 class="font-semibold text-gray-900" x-text="t('conversionGoals')"></h3>
            <p class="text-sm text-gray-500 mt-1 mb-5" x-text="t('conversionGoalsHint')"></p>
            <form @submit.prevent="createGoal" class="grid sm:grid-cols-3 gap-3 mb-5">
                <input x-model="newGoal.name" required maxlength="80" class="rounded-lg border border-gray-200 px-3 py-2 text-sm" :placeholder="t('goalName')">
                <input x-model="newGoal.eventName" required maxlength="64" class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-mono" :placeholder="t('eventName')">
                <button class="rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white hover:bg-purple-700" x-text="t('createGoal')"></button>
            </form>
            <div x-show="conversionGoals.length" class="flex justify-end mb-3">
                <select x-model="conversionDimension" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm">
                    <template x-for="dimension in ['source','medium','campaign','path','device','country']" :key="dimension">
                        <option :value="dimension" x-text="t(`dimension_${dimension}`)"></option>
                    </template>
                </select>
            </div>
            <div class="space-y-3">
                <template x-for="goal in conversionGoals" :key="goal.id">
                    <div class="rounded-lg border border-gray-100 p-4">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <div class="font-medium text-gray-900" x-text="goal.name"></div>
                                <div class="text-sm text-gray-500">
                                    <span class="font-mono" x-text="goal.eventName"></span> · <span x-text="`${getEvent(goal.eventName).visitors} ${t('converters')} · ${formatPercent(getEvent(goal.eventName).rate)}`"></span>
                                </div>
                            </div>
                            <button @click="deleteGoal(goal.id)" class="text-sm text-red-500 hover:text-red-700" x-text="t('delete')"></button>
                        </div>
                        <div x-show="getConversionSegments(goal.eventName).length" class="mt-3 overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="text-xs text-gray-400">
                                    <tr>
                                        <th class="text-left py-2" x-text="t('segment')"></th>
                                        <th class="text-right" x-text="t('audience')"></th>
                                        <th class="text-right" x-text="t('converters')"></th>
                                        <th class="text-right" x-text="t('conversionRate')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="segment in getConversionSegments(goal.eventName)" :key="segment.value">
                                        <tr class="border-t border-gray-50">
                                            <td class="py-2 max-w-36 truncate" :title="segment.value" x-text="segment.value"></td>
                                            <td class="text-right" x-text="segment.audience"></td>
                                            <td class="text-right" x-text="segment.converters"></td>
                                            <td class="text-right font-medium text-purple-600" x-text="formatPercent(segment.rate)"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>
                <p x-show="!conversionGoals.length" class="text-gray-500 text-center py-4 text-sm" x-text="t('noGoals')"></p>
            </div>
        </div>

        <!-- 转化漏斗 -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <h3 class="font-semibold text-gray-900" x-text="t('funnels')"></h3>
            <p class="text-sm text-gray-500 mt-1 mb-5" x-text="t('funnelsHint')"></p>
            <form @submit.prevent="createFunnel" class="space-y-3 mb-5">
                <input x-model="newFunnel.name" required maxlength="80" class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm" :placeholder="t('funnelName')">
                <textarea x-model="newFunnel.stepsText" required rows="2" class="w-full rounded-lg border border-gray-200 px-3 py-2 font-mono text-sm" :placeholder="t('funnelStepsPlaceholder')"></textarea>
                <button class="rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white hover:bg-purple-700" x-text="t('createFunnel')"></button>
            </form>
            <div x-show="funnels.length" class="flex justify-end mb-3">
                <select x-model="funnelDimension" class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm">
                    <template x-for="dimension in ['source','medium','campaign','path','device','country']" :key="dimension">
                        <option :value="dimension" x-text="t(`dimension_${dimension}`)"></option>
                    </template>
                </select>
            </div>
            <div class="space-y-4">
                <template x-for="funnel in funnels" :key="funnel.id">
                    <div class="rounded-lg border border-gray-100 p-4">
                        <div class="flex justify-between gap-4 mb-3">
                            <div class="font-medium text-gray-900" x-text="funnel.name"></div>
                            <button @click="deleteFunnel(funnel.id)" class="text-sm text-red-500 hover:text-red-700" x-text="t('delete')"></button>
                        </div>
                        <div class="space-y-2">
                            <template x-for="(step, index) in (funnelReports[funnel.id]?.steps || [])" :key="`${funnel.id}-${index}`">
                                <div>
                                    <div class="flex justify-between text-sm mb-1">
                                        <span><span class="text-gray-400" x-text="`${index + 1}. `"></span><span class="font-mono" x-text="step.eventName"></span></span>
                                        <span class="font-medium" x-text="`${step.visitors} · ${formatPercent(step.conversionRate)}`"></span>
                                    </div>
                                    <div class="h-2 rounded-full bg-gray-100">
                                        <div class="h-2 rounded-full bg-purple-500" :style="`width: ${Math.max(0, Math.min(100, step.conversionRate))}%`"></div>
                                    </div>
                                    <div x-show="index > 0" class="text-xs text-gray-400 mt-1" x-text="`${t('dropOff')}: ${formatPercent(step.dropOffRate)}`"></div>
                                </div>
                            </template>
                        </div>
                        <div x-show="getFunnelSegments(funnel.id).length" class="mt-4 border-t border-gray-100 pt-3">
                            <div class="text-xs uppercase text-gray-400 mb-2" x-text="t('funnelComparison')"></div>
                            <template x-for="segment in getFunnelSegments(funnel.id)" :key="segment.value">
                                <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-3 py-1.5 text-sm">
                                    <div class="truncate" :title="segment.value"><span x-text="segment.value"></span><span class="text-xs text-gray-400 ml-2" x-text="formatFunnelSteps(segment.steps)"></span></div>
                                    <span class="font-medium text-purple-600" x-text="formatPercent(segment.conversionRate)"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <p x-show="!funnels.length" class="text-gray-500 text-center py-4 text-sm" x-text="t('noFunnels')"></p>
            </div>
        </div>
    </div>

    <!-- UTM 渠道分析 (带分页) -->
    <div class="grid md:grid-cols-3 gap-6">
        <!-- Traffic Sources -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900 text-sm" x-text="t('trafficSources')"></h3>
                <div class="flex items-center gap-1 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.sources) > 8">
                    <button @click="changeBreakdownPage('sources', -1, projectAnalysis.breakdowns.sources)" :disabled="(breakdownPages.sources || 1) <= 1" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.sources || 1} / ${getTotalPages(projectAnalysis.breakdowns.sources, 8)}`"></span>
                    <button @click="changeBreakdownPage('sources', 1, projectAnalysis.breakdowns.sources)" :disabled="(breakdownPages.sources || 1) >= getTotalPages(projectAnalysis.breakdowns.sources, 8)" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.sources, breakdownPages.sources || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.sources, breakdownPages.sources || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-3 text-sm">
                        <span class="text-gray-700 truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-20 bg-gray-200 rounded-full h-2">
                                <div class="bg-indigo-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.sources)"></div>
                            </div>
                            <span class="text-gray-500 text-xs min-w-6 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.sources) === 0" class="text-gray-500 text-center py-4 text-xs" x-text="t('noData')"></p>
        </div>

        <!-- Traffic Mediums -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900 text-sm" x-text="t('trafficMediums')"></h3>
                <div class="flex items-center gap-1 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.mediums) > 8">
                    <button @click="changeBreakdownPage('mediums', -1, projectAnalysis.breakdowns.mediums)" :disabled="(breakdownPages.mediums || 1) <= 1" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.mediums || 1} / ${getTotalPages(projectAnalysis.breakdowns.mediums, 8)}`"></span>
                    <button @click="changeBreakdownPage('mediums', 1, projectAnalysis.breakdowns.mediums)" :disabled="(breakdownPages.mediums || 1) >= getTotalPages(projectAnalysis.breakdowns.mediums, 8)" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.mediums, breakdownPages.mediums || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.mediums, breakdownPages.mediums || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-3 text-sm">
                        <span class="text-gray-700 truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-20 bg-gray-200 rounded-full h-2">
                                <div class="bg-teal-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.mediums)"></div>
                            </div>
                            <span class="text-gray-500 text-xs min-w-6 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.mediums) === 0" class="text-gray-500 text-center py-4 text-xs" x-text="t('noData')"></p>
        </div>

        <!-- Campaigns -->
        <div class="bg-white rounded-xl shadow-sm p-6 stat-card">
            <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-semibold text-gray-900 text-sm" x-text="t('campaigns')"></h3>
                <div class="flex items-center gap-1 text-xs text-gray-500" x-show="getTotalCount(projectAnalysis.breakdowns.campaigns) > 8">
                    <button @click="changeBreakdownPage('campaigns', -1, projectAnalysis.breakdowns.campaigns)" :disabled="(breakdownPages.campaigns || 1) <= 1" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <span x-text="`${breakdownPages.campaigns || 1} / ${getTotalPages(projectAnalysis.breakdowns.campaigns, 8)}`"></span>
                    <button @click="changeBreakdownPage('campaigns', 1, projectAnalysis.breakdowns.campaigns)" :disabled="(breakdownPages.campaigns || 1) >= getTotalPages(projectAnalysis.breakdowns.campaigns, 8)" class="p-0.5 rounded hover:bg-gray-100 disabled:opacity-30">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <div class="space-y-3" x-show="getPaginatedEntries(projectAnalysis.breakdowns.campaigns, breakdownPages.campaigns || 1, 8).length > 0">
                <template x-for="entry in getPaginatedEntries(projectAnalysis.breakdowns.campaigns, breakdownPages.campaigns || 1, 8)" :key="entry[0]">
                    <div class="flex items-center justify-between gap-3 text-sm">
                        <span class="text-gray-700 truncate flex-1" x-text="entry[0]"></span>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="w-20 bg-gray-200 rounded-full h-2">
                                <div class="bg-rose-500 h-2 rounded-full" :style="getBarStyle(entry[1], projectAnalysis.breakdowns.campaigns)"></div>
                            </div>
                            <span class="text-gray-500 text-xs min-w-6 text-right font-medium" x-text="entry[1]"></span>
                        </div>
                    </div>
                </template>
            </div>
            <p x-show="getTotalCount(projectAnalysis.breakdowns.campaigns) === 0" class="text-gray-500 text-center py-4 text-xs" x-text="t('campaignHint')"></p>
        </div>
    </div>
</div>
